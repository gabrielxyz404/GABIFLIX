name: Teste TV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK de teste (x86_64)
        env:
          GABIFLIX_ABIS: x86,x86_64
        run: gradle -p android assembleRelease --no-daemon -q
      - name: Vídeo de teste (som AC3, como os do Real-Debrid)
        continue-on-error: true
        run: |
          timeout 300 sudo apt-get install -y -qq ffmpeg >/dev/null || (sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg >/dev/null)
          mkdir -p /tmp/video && cd /tmp/video
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 120 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a ac3 -ac 6 teste.mkv
          nohup npx --yes http-server -p 8000 -s /tmp/video >/dev/null 2>&1 &
          sleep 8
          sleep 1 && curl -sI http://127.0.0.1:8000/teste.mkv | head -1
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador de TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/tv-test.sh
      - name: Publicar as fotos
        if: always()
        run: |
          cd shots || exit 0
          git init -q -b tv-teste && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm fotos
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tv-teste
