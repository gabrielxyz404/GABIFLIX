name: Mac app teste (sem publicar)

# Compila o FramePlay.app do Mac e testa o player com um vídeo 4:3 e uma legenda de 2 linhas, tirando fotos da tela
# (Ajustar / Preencher / Esticar, painel de sincronização, lista de falas, atraso guardado). NÃO publica nada.
on:
  workflow_dispatch:
  push:
    branches: [mac-paridade, mac-revisao]
    paths:
      - mac/**
      - .github/workflows/mac-app-teste.yml

permissions:
  contents: write

concurrency:
  group: mac-app-teste
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Montar o FramePlay.app
        env:
          FRAMEPLAY_VERSION: 0.0.${{ github.run_number }}
          FRAMEPLAY_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./mac/build.sh 2>&1 | tee build.log
      - name: Mostrar o erro (se houver)
        if: failure()
        run: |
          grep -n -E "error:|fatal|No such|cannot find|VLCKit |framework:" build.log | sort -u -k2 | head -60 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-900)"
          done
      - name: Preparar vídeo 4:3 e legenda
        run: |
          brew install ffmpeg > /dev/null 2>&1 || brew install ffmpeg
          mkdir -p /tmp/srv && cd /tmp/srv
          ffmpeg -loglevel error -f lavfi -i "testsrc2=size=640x480:rate=25:duration=400" -f lavfi -i "sine=frequency=440:duration=400" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest teste.mp4
          python3 - <<'PY'
          lines = ["Não sei o que você quer, mas eu estou aqui.", "Isso é tudo, então vai embora também.", "Obrigado, tá bem, já até muito bem.",
                   "Ele disse: nós temos uma casa. Sim, tudo aqui foi bem.", "Eu não vou com você, porque ela tem uma festa.",
                   "O que é isso? Você viu o meu carro?", "Não é bem assim, mas também não é tão mau.", "Então vamos embora, que já é tarde."]
          def ts(ms):
              h, r = divmod(ms, 3600000); m, r = divmod(r, 60000); s, ms = divmod(r, 1000)
              return "%02d:%02d:%02d,%03d" % (h, m, s, ms)
          out = []
          for i in range(90):
              a = 2000 + i * 3500
              out.append("%d\n%s --> %s\n%s\n%s\n" % (i + 1, ts(a), ts(a + 3000), "Fala número %d (linha de cima)" % (i + 1), lines[i % len(lines)]))
          open("leg.srt", "w", encoding="utf-8").write("\n".join(out))
          PY
          cat > /tmp/serve.py <<'PY'
          import http.server, os, re, socketserver
          class H(http.server.SimpleHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_GET(self): self.serve(True)
              def do_HEAD(self): self.serve(False)
              def serve(self, body):
                  path = self.translate_path(self.path)
                  if not os.path.isfile(path): self.send_error(404); return
                  size = os.path.getsize(path); a, b, code = 0, size - 1, 200
                  m = re.match(r"bytes=(\d*)-(\d*)", self.headers.get("Range", ""))
                  if m:
                      if m.group(1) == "": a = max(0, size - int(m.group(2)))
                      else:
                          a = int(m.group(1))
                          if m.group(2): b = min(size - 1, int(m.group(2)))
                      code = 206
                  self.send_response(code)
                  self.send_header("Content-Type", self.guess_type(path))
                  self.send_header("Accept-Ranges", "bytes")
                  self.send_header("Content-Length", str(b - a + 1))
                  if code == 206: self.send_header("Content-Range", "bytes %d-%d/%d" % (a, b, size))
                  self.end_headers()
                  if body:
                      with open(path, "rb") as f:
                          f.seek(a); left = b - a + 1
                          try:
                              while left > 0:
                                  d = f.read(min(65536, left))
                                  if not d: break
                                  self.wfile.write(d); left -= len(d)
                          except Exception: pass
          class S(socketserver.ThreadingMixIn, http.server.HTTPServer): daemon_threads = True
          S(("127.0.0.1", 8765), H).serve_forever()
          PY
          nohup python3 /tmp/serve.py > /tmp/srv.log 2>&1 &
          sleep 2; curl -sI http://127.0.0.1:8765/teste.mp4 | head -3
      - name: Testar a janela do site (tamanhos, rotas)
        run: |
          xattr -cr mac/build/FramePlay.app
          mkdir -p /tmp/telas
          APP=mac/build/FramePlay.app/Contents/MacOS/FramePlay
          shot() { screencapture -x "/tmp/telas/$1.png" || true; }
          web() { echo "$1" > /tmp/gf-web; sleep "${2:-2.5}"; }
          defaults delete FramePlay 2>/dev/null || true
          $APP --gf-test-web > /tmp/telas/web.log 2>&1 &
          sleep 25
          web "js document.documentElement.getAttribute('data-gf-app') + ' | ' + navigator.userAgent + ' | ' + innerWidth + 'x' + innerHeight"
          cat /tmp/gf-web.out | tee -a /tmp/telas/web-info.txt
          shot w01-home
          web "resize 900 650"; shot w02-home-900
          web "resize 1000 700"; shot w03-home-1000
          web "js location.hash='#/search'; 'ok'"; sleep 2; shot w04-busca
          web "js location.hash='#/settings'; 'ok'"; sleep 2; shot w05-config
          web "js location.hash='#/library'; 'ok'"; sleep 2; shot w06-mais-tarde
          web "js location.hash='#/'; 'ok'"; sleep 2
          web "js (function(){var c=document.querySelectorAll('.gf-card');if(c[0])c[0].click();return c.length})()" 6; cat /tmp/gf-web.out | tee -a /tmp/telas/web-info.txt
          shot w07-netflix
          web "resize 420 640"; shot w08-janela-minima
          web "resize 1000 700"
          web "js (function(){var a=document.querySelector('.gf-poster, [class*=meta-item-container] , .gf-row a');if(a)a.click();return !!a})()" 7; cat /tmp/gf-web.out | tee -a /tmp/telas/web-info.txt
          shot w09-titulo
          pkill -x FramePlay || true
          sleep 2
      - name: Testar o player (telas)
        run: |
          xattr -cr mac/build/FramePlay.app
          mkdir -p /tmp/telas
          APP=mac/build/FramePlay.app/Contents/MacOS/FramePlay
          shot() { screencapture -x "/tmp/telas/$1.png" || true; }
          cmd() { echo "$1" > /tmp/gf-cmd; sleep 2.5; }
          defaults delete FramePlay 2>/dev/null || true
          rm -f /tmp/frameplay-player.log
          $APP --gf-test-play http://127.0.0.1:8765/teste.mp4 - --gf-test-sub http://127.0.0.1:8765/leg.srt > /tmp/telas/app1.log 2>&1 &
          sleep 30
          cmd "state"
          cmd "key 49"; sleep 1; cmd "key 49"
          sleep 2; shot 01-ajustar
          cmd "scale 1"; sleep 2; shot 02-preencher
          cmd "scale 2"; sleep 2; shot 03-esticar
          cmd "scale 0"
          cmd "sync"; sleep 1; shot 04-painel-sync
          cmd "key 124"; cmd "key 36"; cmd "key 36"; cmd "key 36"; shot 05-painel-apos-enter
          cmd "close"
          cmd "speech"; sleep 1; shot 06-lista-de-falas
          cmd "key 125"; cmd "key 125"; shot 07-lista-descida
          cmd "key 36"; sleep 2; shot 08-apos-escolher
          cmd "delay 2500"
          cmd "state"
          sleep 3; shot 09-atraso-2500
          echo "show" > /tmp/gf-cmd; sleep 1; shot 11-controles; sleep 2
          cmd "layout"
          cmd "sync"; cmd "hold 2 0"; sleep 3; cmd "state"
          cmd "hold 1 2"; sleep 3; cmd "state"
          cmd "close"
          cmd "resize 700 460"; cmd "layout"; echo "show" > /tmp/gf-cmd; sleep 1; shot 12-janela-pequena; sleep 2
          cmd "resize 1000 700"; cmd "show"; cmd "layout"
          cmd "fs"; sleep 4; echo "show" > /tmp/gf-cmd; sleep 1; shot 13-tela-cheia; sleep 2; cmd "layout"
          cmd "fs"; sleep 3
          cmd "key 124"; cmd "key 123"; cmd "key 49"; sleep 1; cmd "key 49"
          cmd "delay 2500"
          pkill -x FramePlay || true
          sleep 3
          cp /tmp/frameplay-player.log /tmp/telas/player1.log 2>/dev/null || true
          rm -f /tmp/frameplay-player.log
          # segunda abertura: o atraso guardado tem de voltar sozinho, com o aviso na tela
          $APP --gf-test-play http://127.0.0.1:8765/teste.mp4 - --gf-test-sub http://127.0.0.1:8765/leg.srt > /tmp/telas/app2.log 2>&1 &
          sleep 36
          shot 10-reaberto-aviso
          cmd "state"
          pkill -x FramePlay || true
          cp /tmp/frameplay-player.log /tmp/telas/player2.log 2>/dev/null || true
          grep -E "atraso|escolhida|tela:|estado:|comando" /tmp/telas/player1.log | cut -c1-400 | head -40 || true
          echo ---- segunda abertura
          grep -E "atraso|escolhida|estado:" /tmp/telas/player2.log | cut -c1-400 | head -20 || true
      - name: Guardar as telas no branch mac-revisao-app
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/telas && cp build.log /tmp/telas/ 2>/dev/null || true
          cd /tmp/telas
          git init -q && git checkout -q -b mac-revisao-app
          git config user.name "FramePlay CI"; git config user.email "ci@frameplay.local"
          git add -A && git commit -qm "telas do teste do Mac (paridade)" || true
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" mac-revisao-app || echo "::warning::não guardou as telas"
