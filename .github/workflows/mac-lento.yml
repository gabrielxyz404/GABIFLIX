name: Mac sincronizar numa rede lenta (antes e depois, sem publicar)

# Reproduz o relato do usuário: filme de ~90 min por HTTP numa rede LENTA (redirecionamento 302, 1-3 s de latência por pedido, ~1,5 MB/s para tudo junto,
# o arquivo com o tamanho de um filme de verdade: ~3,5 GB com uma faixa de áudio grande a mais) + legenda PT externa a 25 fps + 4 s. Mede, na versão de antes
# (main) e nesta: segundos até a resposta VISÍVEL (botão Sincronizar e análise automática ao abrir), % das linhas mostradas que batem com a fala e o relatório
# ANALISE recebido (capturado por um servidor local, não vai ao ntfy). Runner macos-15-intel (FRAMEPLAY_ARCH=x86_64). Nunca publica o app.
on:
  push:
    branches: [run-mac-lento]
  workflow_dispatch:
    inputs:
      real_report:
        description: "1 = manda UM relatório de teste de verdade ao ntfy e confere que chegou"
        default: "0"
      rate_kbps:
        description: "velocidade da rede lenta (kB/s, todas as ligações juntas)"
        default: "1500"

permissions:
  contents: write

concurrency:
  group: mac-lento-${{ github.ref }}
  cancel-in-progress: true

env:
  ANTES: 25f3a2409d0fb885a704593c6b4e2a394d59a931

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: film
          key: lento-film-v1-${{ hashFiles('tools/sincronizar/prep_film.py', 'tools/audio-integra/corpus/corpus.py') }}
      - name: O filme de ~90 min e a legenda certa (só vale um filme em que o motor de referência, em Java, aceita a legenda de 25 fps + 4 s)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p /tmp/ort /tmp/pc
          curl -fsSL -o /tmp/ort/ort.jar https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime/1.20.0/onnxruntime-1.20.0.jar
          D=android/app/src/main/java/io/github/gabrielxyz404/gabiflix/audiosync
          javac -nowarn -d /tmp/pc -cp /tmp/ort/ort.jar $D/*.java tools/audio-integra/PreCheck.java
          PRE="java -cp /tmp/pc:/tmp/ort/ort.jar PreCheck"; MODEL=$PWD/android/app/src/main/assets/silero_vad.onnx
          if [ ! -f film/film.mkv ] || [ ! -f film/certa.srt ]; then
            rm -rf film film_*; : > precheck.txt; FIRST=""
            for s in scarlet_street the_stranger night_of_the_living_dead doa my_man_godfrey his_girl_friday; do
              rm -rf film_$s
              python3 tools/sincronizar/prep_film.py $s film_$s > prep-$s.log 2>&1 || { echo "$s: não preparou"; tail -4 prep-$s.log; continue; }
              [ -z "$FIRST" ] && FIRST=$s
              python3 tools/deriva/mkdrift.py film_$s/certa.srt /tmp/sub25.srt 23.976/25 4000
              R=$(SPREAD=1 $PRE film_$s/_work/audio16k.wav /tmp/sub25.srt $MODEL 2>/dev/null | grep ^SPREAD)
              echo "$s -> $R" | tee -a precheck.txt
              rm -rf film_$s/_work
              if echo "$R" | grep -q "accepted=1"; then PICK=$s; break; fi
            done
            PICK=${PICK:-$FIRST}
            [ -n "$PICK" ] || { echo "::error::nenhum filme preparado"; exit 1; }
            echo "filme escolhido: $PICK"; mv film_$PICK film; rm -rf film_*
            cp precheck.txt film/precheck.txt
          fi
          cat film/info.json film/precheck.txt; ls -la film
      - name: Material derivado (25 fps + 4 s) e o arquivo GRANDE (faixa de áudio extra de ~560 kB/s, como a TrueHD/DTS-HD de um filme de verdade)
        run: |
          mkdir -p media
          cp film/film.mkv film/certa.srt film/info.json film/precheck.txt media/ 2>/dev/null || cp film/film.mkv film/certa.srt media/
          python3 tools/deriva/mkdrift.py media/certa.srt media/sub25.srt 23.976/25 4000
          DUR=$(ffprobe -loglevel error -show_entries format=duration -of csv=p=0 media/film.mkv)
          ffmpeg -nostdin -loglevel error -y -i media/film.mkv -f lavfi -t "$DUR" -i "anullsrc=r=48000:cl=5.1" \
            -map 0:v -map 0:a:0 -map 1:a -c:v copy -c:a:0 copy -c:a:1 pcm_s16le -metadata:s:a:1 title="faixa grande (substituto de TrueHD)" media/film-grande.mkv
          cp media/film.mkv /tmp/film-pequeno.mkv
          mv media/film-grande.mkv media/film.mkv
          ffprobe -loglevel error -show_entries stream=index,codec_name,codec_type,channels -of compact media/film.mkv
          ls -la media
      - name: Estudo em Java (o MESMO alinhador do Mac) - 3 janelas perto de onde se está a ver, janelas de 40/60/90 s
        run: |
          D=android/app/src/main/java/io/github/gabrielxyz404/gabiflix/audiosync
          mkdir -p /tmp/pc2
          javac -nowarn -d /tmp/pc2 -cp /tmp/ort/ort.jar $D/*.java tools/audio-integra/PreCheck.java tools/sincronizar/NearStudy.java
          ffmpeg -nostdin -loglevel error -y -i /tmp/film-pequeno.mkv -vn -map 0:a:0 -ac 1 -ar 16000 -c:a pcm_s16le /tmp/a16k.wav
          java -Xmx3g -cp /tmp/pc2:/tmp/ort/ort.jar NearStudy /tmp/a16k.wav media/sub25.srt $PWD/android/app/src/main/assets/silero_vad.onnx 2>&1 | tee estudo.txt
      - name: Publicar o estudo
        if: always()
        run: |
          mkdir -p estudo-out; cp estudo.txt media/info.json media/precheck.txt estudo-out/ 2>/dev/null || true
          cd estudo-out && git init -q -b x && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm estudo
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" x:mac-lento-estudo
      - uses: actions/upload-artifact@v4
        with:
          name: media
          path: media
          retention-days: 3
          compression-level: 9

  app:
    needs: prep
    runs-on: macos-15-intel
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        versao: [antes, depois]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.versao == 'antes' && env.ANTES || github.sha }}
      - uses: actions/checkout@v4
        with:
          path: tools-novas
      - name: Ferramentas de prova (as da versão nova, nas duas)
        run: |
          rm -rf tools/sincronizar; mkdir -p tools; cp -R tools-novas/tools/sincronizar tools/sincronizar
      - uses: actions/download-artifact@v4
        with:
          name: media
          path: /tmp/media
      - name: Montar o FramePlay.app
        env:
          FRAMEPLAY_VERSION: 0.0.${{ github.run_number }}
          FRAMEPLAY_BUILD: ${{ github.run_number }}
          FRAMEPLAY_ARCH: x86_64
        run: |
          set -o pipefail
          ./mac/build.sh 2>&1 | tee build.log
      - name: Mostrar o erro (se houver)
        if: failure()
        run: |
          grep -n -E "error:|fatal|No such|cannot find|VLCKit |framework:" build.log | sort -u -k2 | head -60 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-900)"
          done
      - name: A rede lenta (11470) e o servidor que guarda os relatórios (11481)
        run: |
          ls -la /tmp/media
          RATE_KBPS=${{ github.event.inputs.rate_kbps || '1500' }} LAT_MIN_MS=1000 LAT_MAX_MS=3000 REDIRECT=1 REPORT_PORT=11481 LOG=/tmp/lento.log \
            nohup python3 tools/sincronizar/lento.py /tmp/media 11470 >/tmp/lento.out 2>&1 &
          sleep 2
          curl -sI http://127.0.0.1:11470/film.mkv | head -5
          curl -s -L -o /dev/null -w "range: %{http_code} %{size_download} em %{time_total} s\n" -r 1000-1999 http://127.0.0.1:11470/film.mkv
      - name: Prova no app
        run: |
          xattr -cr mac/build/FramePlay.app
          mkdir -p shots
          chmod +x tools/sincronizar/prova-lento.sh
          export NEWVER=$([ "${{ matrix.versao }}" = "depois" ] && echo 1 || echo 0)
          tools/sincronizar/prova-lento.sh "$PWD/mac/build/FramePlay.app" "$PWD/shots" 2>&1 | tail -120
      - name: Envio real de um relatório ao ntfy (só a versão nova, só se pedido)
        if: matrix.versao == 'depois' && github.event.inputs.real_report == '1'
        run: |
          pkill -x FramePlay || true; sleep 2
          rm -f /tmp/frameplay-player.log /tmp/gf-cmd
          mac/build/FramePlay.app/Contents/MacOS/FramePlay --gf-test-play http://127.0.0.1:11470/sub25.srt - > /dev/null 2>&1 &
          sleep 25
          echo "reporttest" > /tmp/gf-cmd; sleep 25
          grep -E "ANALISE" /tmp/frameplay-player.log | tee shots/ntfy-real.txt || true
          pkill -x FramePlay || true
          sleep 3
          curl -s "https://ntfy.sh/frameplay-crash-7f3k9q2w/json?poll=1&since=2m" | grep -c "teste_ci" | tee shots/ntfy-chegou.txt || true
      - name: Resumo
        if: always()
        run: |
          cat shots/medidas.txt 2>/dev/null || true
          cat shots/conferencia.txt 2>/dev/null || true
          cat shots/fim.txt 2>/dev/null || true
      - name: Publicar as fotos e os registros
        if: always()
        run: |
          mkdir -p shots; cp build.log shots/ 2>/dev/null || true
          cp /tmp/lento.log shots/rede-total.txt 2>/dev/null || true
          cd shots || exit 0
          git init -q -b x && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm fotos
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" x:mac-lento-out-${{ matrix.versao }}
