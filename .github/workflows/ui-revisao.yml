name: UI revisão (telas do site)

# Abre o site (a versão deste commit, servida na própria máquina) com dados reais num Chromium
# e tira fotos no modo Mac e no modo celular. Não publica nada. Fotos vão para o branch ui-revisao-out-<rotulo>.
on:
  workflow_dispatch:
    inputs:
      rotulo:
        description: nome do conjunto (ex. antes, depois)
        default: antes
      perfis:
        description: perfis separados por vírgula (vazio = todos)
        default: ''
      ref:
        description: branch ou commit a testar (vazio = o escolhido no disparo)
        default: ''

permissions:
  contents: write

concurrency:
  group: ui-revisao-${{ github.event.inputs.rotulo }}
  cancel-in-progress: true

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Servir o site
        run: |
          nohup python3 -m http.server 8099 >/tmp/srv.log 2>&1 &
          sleep 2; curl -sI http://localhost:8099/index.html | head -1
      - name: Fotos
        env:
          NODE_PATH: /tmp/pw/node_modules
          BASE: http://localhost:8099/index.html
          OUT: /tmp/out
          TAG: ${{ github.event.inputs.rotulo }}
          PROFILES: ${{ github.event.inputs.perfis }}
        run: node tools/ui-audit/run.js
      - name: Guardar
        if: always()
        run: |
          cd /tmp/out || exit 0
          git init -q -b x && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm fotos
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" x:ui-revisao-out-${{ github.event.inputs.rotulo }}
