name: Mac legendas paridade

# Compara o código Swift portado do Mac (mac/Sources/Sub*.swift) com o Java do Android (a fonte da verdade), decisão por decisão,
# no mesmo corpus de legendas reais (≥ 80 títulos) e nos casos sintéticos. O resumo vai para o log e para o branch mac-paridade-teste.
on:
  workflow_dispatch:
  push:
    branches: [mac-paridade]
    paths:
      - tools/legendas-paridade/**
      - mac/Sources/SubText.swift
      - mac/Sources/SubAlign.swift
      - mac/Sources/SubSync.swift
      - .github/workflows/mac-legendas-paridade.yml

permissions:
  contents: write

concurrency:
  group: mac-legendas-paridade
  cancel-in-progress: true

jobs:
  paridade:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      SRC: android/app/src/main/java/io/github/gabrielxyz404/gabiflix
      LE: tools/legendas-eval
      LP: tools/legendas-paridade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar o Swift portado
        run: |
          set -o pipefail
          swiftc --version
          mkdir -p /tmp/sw /tmp/out
          swiftc -O -o /tmp/sw/paridade mac/Sources/SubText.swift mac/Sources/SubAlign.swift mac/Sources/SubSync.swift $LP/main.swift 2>&1 | tee /tmp/out/swiftc.log || {
            grep -E "error:" /tmp/out/swiftc.log | head -60 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-600)"; done
            exit 1
          }
      - name: Compilar o Java (classes do Android + stubs)
        run: |
          mkdir -p /tmp/j
          javac -encoding UTF-8 -d /tmp/j $SRC/SubtitleAlign.java $SRC/SubtitleText.java $SRC/SubtitleSync.java \
            $LP/stubs/android/net/Uri.java $LP/stubs/android/util/Log.java $LP/stubs/org/json/JSONArray.java $LP/stubs/org/json/JSONObject.java $LP/stubs/PlayerActivity.java \
            $LE/Fetch.java $LP/Synth.java $LP/Paridade.java
      - name: Corpus (cache)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/corpus
          key: corpus-par-v1-${{ hashFiles('tools/legendas-eval/titles.txt') }}
      - name: Baixar legendas reais (OpenSubtitles do Stremio)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/corpus
          java -Dfile.encoding=UTF-8 -cp /tmp/j io.github.gabrielxyz404.gabiflix.Fetch $LE/titles.txt /tmp/corpus 2>&1 | tee /tmp/fetch.log | cut -c1-200 | tail -250
      - name: Guardar o corpus no cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/corpus
          key: corpus-par-v1-${{ hashFiles('tools/legendas-eval/titles.txt') }}
      - name: Resumo do corpus
        run: |
          echo "títulos com meta: $(ls /tmp/corpus/*/meta.txt | wc -l)"; du -sh /tmp/corpus
          echo "arquivos de legenda: $(ls /tmp/corpus/*/*.raw | wc -l)"
      - name: Sintéticos (Java gera os arquivos que os dois lados leem)
        run: java -Dfile.encoding=UTF-8 -cp /tmp/j io.github.gabrielxyz404.gabiflix.Synth /tmp/syn
      - name: Rodar o Java (fonte da verdade)
        run: |
          /usr/bin/time -p java -Dfile.encoding=UTF-8 -Xmx4g -cp /tmp/j io.github.gabrielxyz404.gabiflix.Paridade /tmp/corpus /tmp/syn /tmp/out/java.tsv 14 4 2>&1 | tail -8
      - name: Rodar o Swift (porte)
        run: |
          /usr/bin/time -p /tmp/sw/paridade /tmp/corpus /tmp/syn /tmp/out/swift.tsv 14 4 2>&1 | tail -8
      - name: Comparar decisão por decisão
        run: |
          python3 $LP/compara.py /tmp/out/java.tsv /tmp/out/swift.tsv 60 | tee /tmp/out/resumo.md
          cat /tmp/out/resumo.md >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Guardar o resultado no branch mac-paridade-teste
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/res && cp /tmp/out/resumo.md /tmp/out/swiftc.log /tmp/res/ 2>/dev/null || true
          gzip -c /tmp/out/java.tsv > /tmp/res/java.tsv.gz 2>/dev/null || true
          gzip -c /tmp/out/swift.tsv > /tmp/res/swift.tsv.gz 2>/dev/null || true
          cp /tmp/fetch.log /tmp/res/ 2>/dev/null || true
          cd /tmp/res
          git init -q && git checkout -q -b mac-paridade-teste
          git config user.name "FramePlay CI"; git config user.email "ci@frameplay.local"
          git add -A && git commit -qm "resultado da paridade ${{ github.sha }}" || true
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" mac-paridade-teste || echo "::warning::não guardou o resultado"
      - name: Falhar se houver diferença
        run: |
          python3 $LP/compara.py /tmp/out/java.tsv /tmp/out/swift.tsv 0 | tail -3
          python3 $LP/compara.py /tmp/out/java.tsv /tmp/out/swift.tsv 0 > /dev/null
