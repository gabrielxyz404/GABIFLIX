name: Mac legendas visual (antes e depois, sem publicar)

# Prova visual da legenda do Mac: o MESMO SubOverlay.swift (o do main de antes e o desta versão) desenha por cima de quadros de vídeo reais, num bitmap
# de 2x (como numa MacBook Retina), sem janela nem tela. Falas com acentos, de duas linhas e longas. Nunca publica o app.
# Os PNGs vão para o branch mac-legendas-visual-out.
on:
  push:
    branches: [run-mac-legendas-visual]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-legendas-visual-${{ github.ref }}
  cancel-in-progress: true

env:
  ANTES: 25f3a2409d0fb885a704593c6b4e2a394d59a931

jobs:
  quadros:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Quadros de um vídeo aberto (claro, médio, escuro) e um quadro sintético muito claro
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-pil >/dev/null
          mkdir -p quadros
          for U in https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/1080/Big_Buck_Bunny_1080_10s_5MB.mp4 \
                   https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_5MB.mp4 \
                   https://download.blender.org/peach/bigbuckbunny_movies/BigBuckBunny_320x180.mp4; do
            curl -fsSL -m 120 -o src.mp4 "$U" && break || echo "falhou $U"
          done
          ls -la src.mp4 || true
          i=0
          for T in 1 3 5 8; do
            i=$((i+1))
            ffmpeg -nostdin -loglevel error -y -ss $T -i src.mp4 -frames:v 1 -vf scale=1440:810:flags=lanczos quadros/real$i.png || echo "quadro $i falhou"
          done
          # céu e nuvens: o pior caso para texto branco (fundo claro com detalhe)
          python3 - <<'EOF'
          import random
          from PIL import Image, ImageDraw, ImageFilter
          random.seed(7)
          W, H = 1440, 810
          im = Image.new("RGB", (W, H))
          d = ImageDraw.Draw(im)
          for y in range(H):
              t = y / H
              d.line([(0, y), (W, y)], fill=(int(150 + 90 * t), int(190 + 55 * t), int(235 + 15 * t)))
          for _ in range(70):
              x, y, r = random.randint(0, W), random.randint(380, H), random.randint(40, 130)
              d.ellipse([x - r, y - r // 2, x + r, y + r // 2], fill=(250, 250, 252))
          im = im.filter(ImageFilter.GaussianBlur(6))
          d = ImageDraw.Draw(im)
          for x in range(0, W, 24):
              d.line([(x, 640), (x + 10, 700)], fill=(235, 235, 240), width=3)
          im.save("quadros/claro.png")
          EOF
          ls -la quadros
      - uses: actions/upload-artifact@v4
        with:
          name: quadros
          path: quadros
          retention-days: 3

  render:
    needs: quadros
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        versao: [antes, depois]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.versao == 'antes' && env.ANTES || github.sha }}
      - uses: actions/checkout@v4
        with:
          path: tools-novas
      - uses: actions/download-artifact@v4
        with:
          name: quadros
          path: quadros
      - name: Compilar o desenhador com o SubOverlay.swift desta versão
        run: |
          mkdir -p b
          cp tools-novas/tools/mac-subs-render/render.swift b/main.swift
          cp mac/Sources/SubOverlay.swift b/SubOverlay.swift
          swiftc -O -target arm64-apple-macos11.0 b/main.swift b/SubOverlay.swift -o render 2>&1 | tail -30
          ls -la render
      - name: Desenhar a 2x
        run: |
          mkdir -p out
          ./render out ${{ matrix.versao }} quadros/*.png
          ls out | head -80
      - name: Publicar os PNGs
        if: always()
        run: |
          cd out || exit 0
          git init -q -b x && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm "legendas ${{ matrix.versao }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" x:mac-legendas-visual-out-${{ matrix.versao }}
