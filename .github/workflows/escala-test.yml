name: Teste escala do player

# Prova do bug "legenda sai do sítio em Preencher/Esticar": emulador de telemóvel (20:9) e de TV (16:9).
# Só à mão ou ao empurrar o branch escala-run; nunca publica o app.
on:
  workflow_dispatch:
    inputs:
      rotulo:
        description: antes ou depois
        default: antes
  push:
    branches: [escala-run]

permissions:
  contents: write

jobs:
  escala:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        perfil: [tel, tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK de teste (x86)
        env:
          GABIFLIX_ABIS: x86,x86_64
        run: gradle -p android assembleRelease --no-daemon -q
      - name: Vídeo 16:9 com legendas
        run: |
          timeout 300 sudo apt-get install -y -qq ffmpeg >/dev/null || (sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg >/dev/null)
          mkdir -p /tmp/video && cd /tmp/video
          python3 - <<'PY'
          def ts(s): return "%02d:%02d:%02d,000"%(s//3600,s//60%60,s%60)
          out=[]
          for i in range(30):
              a=i*10; out.append("%d\n%s --> %s\nVocê não sabe o que ela fez para nós, mas eu também estou aqui (%d)\ne isso é uma linha de baixo que tem de ficar inteira, com você\n"%(i+1,ts(a),ts(a+9),i+1))
          open("teste.srt","w").write("\n".join(out))
          PY
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 300 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac teste.mkv
          ffmpeg -loglevel error -i teste.mkv -i teste.srt -map 0 -map 1 -c copy -c:s srt -metadata:s:s:0 language=por -disposition:s:0 default emb.mkv
          nohup npx --yes http-server -p 8000 -s /tmp/video >/dev/null 2>&1 &
          sleep 8; curl -sI http://127.0.0.1:8000/teste.mkv | head -1
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador de telemóvel
        if: matrix.perfil == 'tel'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/escala-test/run.sh ${{ github.event.inputs.rotulo || 'antes' }} tel
      - name: Emulador de TV
        if: matrix.perfil == 'tv'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/escala-test/run.sh ${{ github.event.inputs.rotulo || 'antes' }} tv
      - name: Publicar as fotos
        if: always()
        run: |
          cd shots || exit 0
          git init -q -b x && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm fotos
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" x:escala-teste-${{ github.event.inputs.rotulo || 'antes' }}-${{ matrix.perfil }}
