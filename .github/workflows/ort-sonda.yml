name: ORT sonda
on:
  push:
    branches: [run-ort-sonda]
jobs:
  s:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Buscar
        run: |
          mkdir -p w && FW=$(mac/ort/fetch.sh "$PWD/w" arm64 | tail -1); echo "FW=$FW"; ls -la "$FW" "$FW/Headers" | head -20; file "$FW/onnxruntime"; du -sh "$FW"
