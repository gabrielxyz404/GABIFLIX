name: Prova renomear FramePlay (sem publicar)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        perfil: [tel, tv]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK novo e APK antigo (x86), mesma chave
        env:
          GABIFLIX_ABIS: x86,x86_64
          GABIFLIX_VERSION_CODE: 900
          GABIFLIX_VERSION_NAME: 1.0.900
        run: |
          mkdir -p /tmp/apks
          gradle -p android assembleRelease --no-daemon -q
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/apks/novo.apk
          git worktree add /tmp/antigo origin/main
          GABIFLIX_VERSION_CODE=800 GABIFLIX_VERSION_NAME=1.0.800 gradle -p /tmp/antigo/android assembleRelease --no-daemon -q
          cp /tmp/antigo/android/app/build/outputs/apk/release/app-release.apk /tmp/apks/antigo.apk
      - name: Provas estáticas do APK (nome, pacote, assinatura)
        run: |
          mkdir -p shots
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for f in novo antigo; do
            { echo "== $f"; $BT/aapt dump badging /tmp/apks/$f.apk | grep -E "^package|application-label|launchable-activity|banner|leanback"; $BT/apksigner verify --print-certs /tmp/apks/$f.apk | grep -E "SHA-256|Verifies"; } >> shots/${{ matrix.perfil }}-apk.txt 2>&1
          done
          # o APK realmente publicado (1.0.84 ou o que estiver), arm64: mesma assinatura?
          curl -fsSL -o /tmp/apks/publicado.apk https://github.com/${{ github.repository }}/releases/download/android/GabiFlix.apk || true
          if [ -s /tmp/apks/publicado.apk ]; then { echo "== publicado"; $BT/aapt dump badging /tmp/apks/publicado.apk | grep -E "^package|application-label"; $BT/apksigner verify --print-certs /tmp/apks/publicado.apk | grep -E "SHA-256|Verifies"; } >> shots/${{ matrix.perfil }}-apk.txt 2>&1; fi
          cat shots/${{ matrix.perfil }}-apk.txt
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OLD_APK: /tmp/apks/antigo.apk
          NEW_APK: /tmp/apks/novo.apk
        with:
          api-level: 30
          target: ${{ matrix.perfil == 'tv' && 'android-tv' || 'default' }}
          arch: x86
          profile: ${{ matrix.perfil == 'tv' && 'tv_1080p' || 'pixel_5' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/renomear-prova/run.sh ${{ matrix.perfil }}
      - name: Publicar as fotos
        if: always()
        run: |
          cd shots || exit 0
          git init -q -b x && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm fotos
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" x:renomear-prova-${{ matrix.perfil }}
