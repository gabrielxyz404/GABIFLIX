name: Mac compila (só montar o app, sem publicar)

# Verificação rápida de que o app do Mac compila (mesma montagem do mac.yml, mas sem testes nem publicação).
on:
  push:
    branches: [run-mac-compila]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-compila-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Testar o leitor da release (atualizador)
        run: ./mac/tests/updateparse/run.sh
      - name: Montar o FramePlay.app
        env:
          FRAMEPLAY_BUILD: ${{ github.run_number }}
          FRAMEPLAY_ARCH: x86_64
        run: |
          set -o pipefail
          ./mac/build.sh 2>&1 | tee build.log
      - name: Conferir a versão no Info.plist
        run: |
          v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" mac/build/FramePlay.app/Contents/Info.plist)
          b=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" mac/build/FramePlay.app/Contents/Info.plist)
          echo "::notice::versão=$v build=$b"
          [ "$v" = "2.0" ] && [ "$b" = "${{ github.run_number }}" ]
      - name: Mostrar o erro (se houver)
        if: failure()
        run: |
          grep -n -E "error:|fatal|No such|cannot find|framework:" build.log | sort -u -k2 | head -60 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-900)"
          done
