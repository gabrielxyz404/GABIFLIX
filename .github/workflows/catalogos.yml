name: Atualizar catálogos

on:
  schedule:
    - cron: '17 5 * * *'   # todo dia ~06:17 em Portugal (05:17 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build-catalogs.mjs
      - .github/workflows/catalogos.yml

permissions:
  contents: write

concurrency:
  group: catalogos
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar catálogos do Brasil e de Portugal
        run: node tools/build-catalogs.mjs
      - name: Salvar no repositório
        run: |
          git config user.name "gabiflix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza catálogos ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
