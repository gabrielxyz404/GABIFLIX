name: Teste áudio

# Prova da fase 3 (acertar a legenda pelo áudio): testes JVM + emulador com "Tears of Steel" (filme aberto da Blender).
# Só dispara à mão ou ao empurrar o branch audio-run; nunca publica o app.
on:
  workflow_dispatch:
  push:
    branches: [audio-run]

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Testes JVM (VAD + alinhamento, áudio sintético)
        continue-on-error: true
        run: |
          mkdir -p /tmp/ae out
          SRC=android/app/src/main/java/io/github/gabrielxyz404/gabiflix
          javac -d /tmp/ae $SRC/SubtitleAlign.java $SRC/AudioAlign.java tools/audio-eval/AudioTest.java 2>&1 | grep -v '^Note' || true
          java -cp /tmp/ae io.github.gabrielxyz404.gabiflix.AudioTest 2>&1 | tee out/jvm.txt | tail -60
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK de teste (x86)
        env:
          GABIFLIX_ABIS: x86,x86_64
        run: gradle -p android assembleRelease --no-daemon -q
      - name: Filme de teste (Tears of Steel) e legendas
        run: |
          timeout 300 sudo apt-get install -y -qq ffmpeg >/dev/null || (sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg >/dev/null)
          mkdir -p /tmp/dl /tmp/media && cd /tmp/dl
          ok=0
          for base in https://download.blender.org/demo/movies/ToS http://ftp.nluug.nl/pub/graphics/blender/demo/movies/ToS https://plug-neomirror.rcac.purdue.edu/blender/demo/movies/ToS; do
            curl -fL -sS --retry 3 -o tos720.mov "$base/tears_of_steel_720p.mov" && curl -fL -sS --retry 3 -o TOS-en.srt "$base/subtitles/TOS-en.srt" && { ok=1; break; }
          done
          [ $ok = 1 ] || { echo "não baixou o filme"; exit 1; }
          ls -la; ffprobe -hide_banner tos720.mov 2>&1 | tail -12
          ffmpeg -loglevel error -i tos720.mov -map 0:v:0 -map 0:a:0 -c copy /tmp/media/tos.mkv
          ffmpeg -loglevel error -i tos720.mov -map 0:v:0 -map 0:a:0 -c:v copy -af "pan=5.1|FL=0.5*FL|FR=0.5*FR|FC=0.7*FL+0.7*FR|LFE=0.1*FL|BL=0.3*FL|BR=0.3*FR" -c:a ac3 -b:a 448k /tmp/media/tos_ac3.mkv
          cp TOS-en.srt /tmp/media/
          python3 $GITHUB_WORKSPACE/tools/audio-test/mksubs.py TOS-en.srt /tmp/media
          ls -la /tmp/media; head -12 /tmp/media/TOS-en.srt
          ffprobe -hide_banner /tmp/media/tos.mkv 2>&1 | grep -E "Duration|Stream"
          ffprobe -hide_banner /tmp/media/tos_ac3.mkv 2>&1 | grep -E "Duration|Stream"
          nohup python3 $GITHUB_WORKSPACE/tools/audio-test/server.py /tmp/media 8000 >/tmp/server.out 2>&1 &
          sleep 2; curl -sI http://127.0.0.1:8000/tos.mkv | head -3
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/audio-test/run.sh
      - name: Publicar resultados
        if: always()
        run: |
          mkdir -p shots; cp out/jvm.txt shots/ 2>/dev/null || true
          cp /tmp/server-bytes.log shots/ 2>/dev/null || true
          cd shots || exit 0
          [ -f resultado.md ] && cat resultado.md >> "$GITHUB_STEP_SUMMARY"
          git init -q -b audio-teste && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm "resultados do teste de áudio"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" audio-teste
