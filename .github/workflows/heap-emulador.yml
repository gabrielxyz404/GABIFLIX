name: Memoria nativa do player (heapprofd no emulador)

# Diagnostico: onde a memoria NATIVA do player cresce na reproducao continua. Cada perna toca um filme de 35 min por PLAY segundos no emulador,
# mede a memoria a cada 30 s (dumpsys meminfo) e, nas pernas com heapprofd, grava um trace do Perfetto e o resume por chamada (heap_analyze.py).
# As pernas diferem em UMA coisa (TextureView/SurfaceView, decodificador por software/hardware, sincronizacao pelo audio, TV/celular) para achar a causa.
# Nunca publica o app. Resultados no branch heap-out-<perna>-<sha>.
on:
  push:
    branches: ['run-heap**']
  workflow_dispatch:
    inputs:
      play:
        description: segundos de reproducao continua
        default: '900'

permissions:
  contents: write

jobs:
  heap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nome: tv30, modo: tv, api: 30, target: android-tv, profile: tv_1080p, ram: 2048M, hp: startup }
          - { nome: cel30, modo: phone, api: 30, target: google_apis, profile: pixel_5, ram: 3072M, hp: startup }
          - { nome: tv30-trim, modo: tv, api: 30, target: android-tv, profile: tv_1080p, ram: 2048M, hp: none, play: '200', trim: '1', extra: '--es gfMemTelMs 60000' }
          - { nome: cel30-trim, modo: phone, api: 30, target: google_apis, profile: pixel_5, ram: 3072M, hp: none, play: '200', trim: '1', extra: '--es gfMemTelMs 60000' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK de teste (x86)
        env:
          GABIFLIX_ABIS: x86,x86_64
        run: |
          # so no APK de teste (a copia de trabalho do CI, nada e commitado): depuravel, para o heapprofd e o run-as funcionarem nas imagens "user" do emulador de TV
          sed -i 's/android:largeHeap="true">/android:largeHeap="true" android:debuggable="true">/' android/app/src/main/AndroidManifest.xml
          grep -c 'android:debuggable="true"' android/app/src/main/AndroidManifest.xml
          gradle -p android assembleRelease -x lintVitalRelease --no-daemon -q
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/teste.apk
          mkdir -p /tmp/libs && unzip -o -j /tmp/teste.apk 'lib/x86/*' -d /tmp/libs >/dev/null
          ls -la /tmp/libs
          for f in /tmp/libs/libvlc.so /tmp/libs/libvlcjni.so; do echo "== $f"; readelf -S "$f" | grep -E "symtab|debug|dynsym" || true; done
      - name: API do libVLC (o que o Java sabe dizer sobre o decodificador)
        run: |
          AAR=$(find ~/.gradle -name 'libvlc-all-3.6.0*.aar' | head -1); echo "$AAR"
          mkdir -p /tmp/aar && unzip -o -q "$AAR" classes.jar -d /tmp/aar
          { javap -p -c -cp /tmp/aar/classes.jar org.videolan.libvlc.MediaPlayer | sed -n '/IMedia getMedia/,/areturn/p'; javap -p -cp /tmp/aar/classes.jar org.videolan.libvlc.LibVLC org.videolan.libvlc.MediaPlayer org.videolan.libvlc.Media 'org.videolan.libvlc.Media$Stats' org.videolan.libvlc.util.HWDecoderUtil 'org.videolan.libvlc.util.HWDecoderUtil$Decoder' org.videolan.libvlc.interfaces.IMedia 'org.videolan.libvlc.interfaces.IMedia$VideoTrack' 'org.videolan.libvlc.interfaces.IMedia$Track' org.videolan.libvlc.interfaces.IVLCVout; unzip -l "$AAR" | grep -E "\.so|jni"; } > /tmp/javap.txt 2>&1 || true
          grep -n -i "hw\|decoder\|accel\|log\|stats" /tmp/javap.txt | head -60
      - name: Filmes de teste (35 min)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          DUR=2100 BV=2M python3 tools/player-abre-test/mk-media.py /tmp/media
          ls -la /tmp/media
          nohup python3 tools/audio-integra/server.py /tmp/media 8000 >/tmp/server.out 2>&1 &
          sleep 2; curl -sI http://127.0.0.1:8000/film.mkv | head -3
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador (${{ matrix.nome }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86
          profile: ${{ matrix.profile }}
          ram-size: ${{ matrix.ram }}
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.gpu || 'swiftshader_indirect' }} -no-snapshot -noaudio -no-boot-anim
          script: timeout 4200 env TRIM=${{ matrix.trim || 0 }} bash tools/bug-sweep/stress/heap.sh /tmp/teste.apk ${{ matrix.modo }} ${{ matrix.play || github.event.inputs.play || '900' }} "${{ matrix.extra }}" ${{ matrix.hp }}
      - name: Analise do heapprofd
        if: always() && matrix.hp != 'none'
        run: |
          pip install -q perfetto 2>&1 | tail -2
          ls -la shots/heap.trace || exit 0
          python3 tools/bug-sweep/stress/heap_analyze.py shots/heap.trace /tmp/libs > shots/heap-resumo.txt 2>&1 || true
          head -150 shots/heap-resumo.txt
      - name: Resumo
        if: always()
        run: |
          cd shots 2>/dev/null || exit 0
          { echo '### ${{ matrix.nome }}'; echo '```'; cat aparelho.txt resultado.txt 2>/dev/null; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - name: Publicar
        if: always()
        run: |
          cd shots || exit 0
          cp /tmp/server.out . 2>/dev/null || true
          cp /tmp/heap.cfg . 2>/dev/null || true
          cp /tmp/javap.txt . 2>/dev/null || true
          { for f in /tmp/libs/libvlc.so /tmp/libs/libvlcjni.so; do echo "== $f"; ls -la $f; readelf -S $f | grep -E "symtab|debug|dynsym"; done; } > libs-info.txt 2>&1 || true
          git init -q -b x && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm resultados
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" x:heap-out-${{ matrix.nome }}-${GITHUB_SHA::7}
