name: Razoes JVM (temporario)
on:
  push:
    branches: [run-razoes-jvm]
permissions:
  contents: read
jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Testes JVM
        run: gradle -p android testReleaseUnitTest --no-daemon
      - name: Compila o APK
        run: gradle -p android assembleRelease --no-daemon
