name: Integ JVM (temporario, nao publica)
on:
  push:
    branches: [integ-jvm]
permissions:
  contents: read
jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python3 tools/versao/test_nextversion.py
      - run: gradle -p android testReleaseUnitTest assembleRelease --no-daemon
