name: Teste legendas Android

# Legendas ponta a ponta no emulador (celular e TV). Roda ao empurrar o branch android-revisao-run (ou à mão). Nunca publica o app.
on:
  workflow_dispatch:
    inputs:
      out_branch:
        description: branch onde as fotos são publicadas
        default: android-revisao-out
  push:
    branches: [android-revisao-run]

permissions:
  contents: write

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        perfil: [tel, tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK de teste (x86)
        env:
          GABIFLIX_ABIS: x86,x86_64
        run: gradle -p android assembleRelease --no-daemon -q
      - name: Vídeos e legendas de teste
        run: |
          timeout 300 sudo apt-get install -y -qq ffmpeg >/dev/null || (sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg >/dev/null)
          mkdir -p /tmp/video && cd /tmp/video
          python3 - <<'PY'
          def ts(ms): return "%02d:%02d:%02d,%03d"%(ms//3600000,ms//60000%60,ms//1000%60,ms%1000)
          def mk(name, tag, shift):
              out=[]
              for i in range(30):
                  a=i*10000+shift
                  out.append("%d\n%s --> %s\nVocê não sabe o que ela fez para nós, mas eu também estou aqui [%s %02d @%ds]\ne isso é uma linha de baixo que tem de ficar inteira, com você\n"%(i+1,ts(a),ts(a+9600),tag,i+1,a//1000))
              open(name,"w").write("\n".join(out))
          mk("a1.srt","ALFA",0); mk("a2.srt","CHARLIE",0); mk("b.srt","BRAVO",4000); mk("emb.srt","EMB",0)
          PY
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 300 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac teste.mkv
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x804:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 200 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac wide.mkv
          ffmpeg -loglevel error -i teste.mkv -i emb.srt -map 0 -map 1 -c copy -c:s srt -metadata:s:s:0 language=por -disposition:s:0 default emb.mkv
          nohup npx --yes http-server -p 8000 -s /tmp/video >/dev/null 2>&1 &
          sleep 8; curl -sI http://127.0.0.1:8000/teste.mkv | head -1
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador de celular
        if: matrix.perfil == 'tel'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/android-subs-test/run.sh tel
      - name: Emulador de TV
        if: matrix.perfil == 'tv'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/android-subs-test/run.sh tv
      - name: Publicar as fotos
        if: always()
        run: |
          cd shots || exit 0
          git init -q -b x && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm fotos
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" x:${{ github.event.inputs.out_branch || 'android-revisao-out' }}-${{ matrix.perfil }}
