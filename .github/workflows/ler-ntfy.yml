name: ler-ntfy
on:
  push:
    branches: [ler-ntfy]
permissions:
  contents: write
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir o && cd o
          curl -sS -w "\nHTTP %{http_code}\n" "https://ntfy.sh/frameplay-crash-7f3k9q2w/json?poll=1&since=all" -o ntfy.jsonl > info.txt 2>&1 || true; curl -sS -w "\nHTTP %{http_code}\n" "https://ntfy.sh/frameplay-crash-7f3k9q2w/json?poll=1&since=24h" >> info.txt 2>&1 || true
          git init -q -b ntfy-out && git add ntfy.jsonl info.txt
          git -c user.name=ci -c user.email=ci@x commit -qm ntfy
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ntfy-out
