name: Mac menu de legendas (sem publicar)

# Compila o FramePlay.app do Mac e testa o menu do botão Legendas: lista de faixas, sincronização automática e ajuste manual
# (fotos da tela com o menu aberto + log). NÃO publica nada.
on:
  workflow_dispatch:
  push:
    branches: [mac-legendas-menu]
    paths:
      - mac/**
      - .github/workflows/mac-legendas-menu-test.yml

permissions:
  contents: write

concurrency:
  group: mac-legendas-menu-test
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Montar o FramePlay.app
        env:
          FRAMEPLAY_VERSION: 0.0.${{ github.run_number }}
          FRAMEPLAY_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          FRAMEPLAY_ARCH=x86_64 ./mac/build.sh 2>&1 | tee build.log
      - name: Mostrar o erro (se houver)
        if: failure()
        run: |
          grep -n -E "error:|fatal|No such|cannot find|VLCKit |framework:" build.log | sort -u -k2 | head -60 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-900)"
          done
      - name: Preparar vídeo com legendas embutidas e a legenda baixada
        run: |
          brew install ffmpeg > /dev/null 2>&1 || brew install ffmpeg
          mkdir -p /tmp/srv && cd /tmp/srv
          python3 - <<'PY'
          import random
          random.seed(7)
          lines = ["Não sei o que você quer, mas eu estou aqui.", "Isso é tudo, então vai embora também.", "Obrigado, tá bem, já até muito bem.",
                   "Ele disse: nós temos uma casa. Sim, tudo aqui foi bem.", "Eu não vou com você, porque ela tem uma festa."]
          def ts(ms):
              h, r = divmod(ms, 3600000); m, r = divmod(r, 60000); s, ms = divmod(r, 1000)
              return "%02d:%02d:%02d,%03d" % (h, m, s, ms)
          starts, t = [], 4000
          for i in range(90):
              starts.append(t); t += random.randint(2200, 5200)
          def write(name, shift, text):
              out = []
              for i, a in enumerate(starts):
                  a2 = a + shift
                  out.append("%d\n%s --> %s\n%s\n" % (i + 1, ts(a2), ts(a2 + 1800), text(i)))
              open(name, "w", encoding="utf-8").write("\n".join(out))
          write("ref.srt", 0, lambda i: "Line number %d of the reference" % (i + 1))     # tempos certos (outro idioma)
          write("leg.srt", -1200, lambda i: "Fala número %d\n%s" % (i + 1, lines[i % 5]))   # a legenda baixada: 1,2 s adiantada
          write("emb1.srt", 0, lambda i: "Embutida 1, fala %d" % (i + 1))
          write("emb2.srt", 0, lambda i: "Embutida 2 (forçada), fala %d" % (i + 1))
          PY
          ffmpeg -loglevel error -f lavfi -i "testsrc2=size=640x480:rate=25:duration=500" -f lavfi -i "sine=frequency=440:duration=500" \
            -i emb1.srt -i emb2.srt -map 0:v -map 1:a -map 2 -map 3 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -c:s srt -shortest \
            -metadata:s:s:0 language=por -metadata:s:s:0 title="Português" \
            -metadata:s:s:1 language=por -metadata:s:s:1 title="Português (forçada)" teste.mkv
          ls -la
          cat > /tmp/serve.py <<'PY'
          import http.server, os, re, socketserver
          class H(http.server.SimpleHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_GET(self): self.serve(True)
              def do_HEAD(self): self.serve(False)
              def serve(self, body):
                  path = self.translate_path(self.path)
                  if not os.path.isfile(path): self.send_error(404); return
                  size = os.path.getsize(path); a, b, code = 0, size - 1, 200
                  m = re.match(r"bytes=(\d*)-(\d*)", self.headers.get("Range", ""))
                  if m:
                      if m.group(1) == "": a = max(0, size - int(m.group(2)))
                      else:
                          a = int(m.group(1))
                          if m.group(2): b = min(size - 1, int(m.group(2)))
                      code = 206
                  self.send_response(code)
                  self.send_header("Content-Type", self.guess_type(path))
                  self.send_header("Accept-Ranges", "bytes")
                  self.send_header("Content-Length", str(b - a + 1))
                  if code == 206: self.send_header("Content-Range", "bytes %d-%d/%d" % (a, b, size))
                  self.end_headers()
                  if body:
                      with open(path, "rb") as f:
                          f.seek(a); left = b - a + 1
                          try:
                              while left > 0:
                                  d = f.read(min(65536, left))
                                  if not d: break
                                  self.wfile.write(d); left -= len(d)
                          except Exception: pass
          class S(socketserver.ThreadingMixIn, http.server.HTTPServer): daemon_threads = True
          S(("127.0.0.1", 8765), H).serve_forever()
          PY
          nohup python3 /tmp/serve.py > /tmp/srv.log 2>&1 &
          sleep 2; curl -sI http://127.0.0.1:8765/teste.mp4 | head -3
      - name: Testar o menu
        run: |
          xattr -cr mac/build/FramePlay.app
          mkdir -p /tmp/telas
          APP=mac/build/FramePlay.app/Contents/MacOS/FramePlay
          shot() { screencapture -x "/tmp/telas/$1.png" || true; }
          cmd() { echo "$1" > /tmp/gf-cmd; sleep 2.5; }
          # abre o menu, tira a foto com ele aberto e espera ele fechar sozinho
          # manda o comando e tira a foto 1 s depois (os avisos somem em 3-5 s)
          cmdshot() { echo "$2" > /tmp/gf-cmd; sleep 1.2; shot "$1"; sleep 1.5; }
          menushot() { echo "menu 7" > /tmp/gf-cmd; sleep 3; shot "$1"; sleep 6; }
          defaults delete FramePlay 2>/dev/null || true
          rm -f /tmp/frameplay-player.log
          $APP --gf-test-play http://127.0.0.1:8765/teste.mkv - --gf-test-sub http://127.0.0.1:8765/leg.srt > /tmp/telas/app1.log 2>&1 &
          sleep 40
          cmd "state"
          echo "== 1. legenda embutida ativa: sincronização automática desativada"
          cmd "menudump"; menushot 01-menu-embutida
          echo "== 2. escolhe a baixada pelo menu"
          cmd "menuclick Português 1"; cmd "state"; cmd "menudump"; menushot 02-menu-baixada
          echo "== 3. sincronização automática SEM referência: não consegue"
          cmdshot 03-aviso-nao-consegui "menuclick Sincronizar automaticamente"; cmd "state"
          echo "== 4. com referência: acerta"
          cmd "ref http://127.0.0.1:8765/ref.srt"; sleep 3
          cmdshot 04-aviso-acertada "menuclick Sincronizar automaticamente"; cmd "state"
          echo "== 5. de novo: já estava certa"
          cmdshot 05-aviso-ja-certa "menuclick Sincronizar automaticamente"; cmd "state"
          echo "== 6. ajuste manual pelo menu"
          cmdshot 06-aviso-manual "menuclick +5 s"; cmd "state"
          cmd "menuclick +1 s"; cmd "state"
          cmd "menuclick −10 s"; cmd "state"
          cmd "menuclick −5 s"; cmd "state"
          cmd "menuclick −1 s"; cmd "state"
          cmd "menuclick +10 s"; cmd "state"
          menushot 07-menu-com-atraso
          cmd "key 4"; cmd "state"
          cmd "key 5"; cmd "key 5"; cmd "state"
          cmd "menuclick Repor"; cmd "state"
          echo "== 7. a automática de novo, e guarda"
          cmd "menuclick Sincronizar automaticamente"; sleep 2; cmd "state"
          cmd "menuclick +1 s"; cmd "state"
          pkill -x FramePlay || true
          sleep 3
          cp /tmp/frameplay-player.log /tmp/telas/player1.log 2>/dev/null || true
          rm -f /tmp/frameplay-player.log
          echo "== 8. reabre: o atraso guardado volta sozinho"
          $APP --gf-test-play http://127.0.0.1:8765/teste.mkv - --gf-test-sub http://127.0.0.1:8765/leg.srt > /tmp/telas/app2.log 2>&1 &
          sleep 40
          cmd "menuclick Português 1"; sleep 1; shot 08-reaberto; cmd "state"
          pkill -x FramePlay || true
          cp /tmp/frameplay-player.log /tmp/telas/player2.log 2>/dev/null || true
          grep -E "menu aberto|^.*menu:|clique no menu|sincroniza|atraso da legenda|estado:|referência de teste" /tmp/telas/player1.log | cut -c1-600 || true
          echo ---- segunda abertura
          grep -E "atraso da legenda|estado:" /tmp/telas/player2.log | cut -c1-400 || true
      - name: Guardar as telas no branch mac-legendas-menu-app
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/telas && cp build.log /tmp/telas/ 2>/dev/null || true
          cd /tmp/telas
          git init -q && git checkout -q -b mac-legendas-menu-app
          git config user.name "FramePlay CI"; git config user.email "ci@frameplay.local"
          git add -A && git commit -qm "telas do teste do menu de legendas do Mac" || true
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" mac-legendas-menu-app || echo "::warning::não guardou as telas"
