name: Teste do relatório de erros

# Prova no emulador (Android 11 com motivo da morte; Android 9 sem ele, como o Fire TV Stick 4K) que a queda Java, a queda nativa e o envio ao ntfy funcionam.
# Nunca publica o app. Resultados no branch crash-out-<api>.
on:
  push:
    branches: [crash-run]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 28]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Testes JVM (classificação dos avisos de erro)
        run: gradle -p android testReleaseUnitTest --no-daemon
      - name: APK de teste (x86)
        env:
          GABIFLIX_ABIS: x86,x86_64
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Mostrar o erro (se houver)
        if: failure()
        run: |
          grep -n -E "error:|What went wrong|Could not|FAILURE|e: |> .*" build.log | head -25 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-900)"
          done
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/crash-test/run.sh android/app/build/outputs/apk/release/app-release.apk api${{ matrix.api }}
      - name: Publicar o resultado
        if: always()
        run: |
          cd shots || exit 0
          git init -q -b x && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm resultado
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" x:crash-out-${{ matrix.api }}
