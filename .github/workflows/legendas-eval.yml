name: Legendas avaliação

on:
  workflow_dispatch:
    inputs:
      ref_base:
        description: 'versão ANTES (commit/branch com o SubtitleAlign a comparar)'
        default: 'origin/main'
      refetch:
        description: 'baixar o corpus de novo (s) ou reaproveitar o cache'
        default: ''

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SRC: android/app/src/main/java/io/github/gabrielxyz404/gabiflix
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar ANTES (SubtitleAlign da versão base) e DEPOIS (deste branch)
        run: |
          mkdir -p /tmp/ev/base /tmp/ev/new /tmp/ev/basesrc /tmp/out
          B="${{ github.event.inputs.ref_base || 'origin/main' }}"
          git show "$B:$SRC/SubtitleAlign.java" > /tmp/ev/basesrc/SubtitleAlign.java
          git show "$B:$SRC/SubtitleSync.java" > /tmp/ev/basesrc/SubtitleSync.java
          T=tools/legendas-eval
          STUBS="$T/stubs/android/net/Uri.java $T/stubs/android/util/Log.java $T/stubs/org/json/JSONArray.java $T/stubs/org/json/JSONObject.java $T/stubs/PlayerActivity.java"
          javac -d /tmp/ev/base /tmp/ev/basesrc/SubtitleAlign.java /tmp/ev/basesrc/SubtitleSync.java $STUBS $T/Eval.java $T/Diff.java $T/Fetch.java $T/base/Variant.java
          javac -d /tmp/ev/new $SRC/SubtitleAlign.java $SRC/SubtitleText.java $SRC/SubtitleSync.java $STUBS $T/Eval.java $T/Diff.java $T/Fetch.java $T/new/Variant.java
      - name: Testes sintéticos do alinhamento (deste branch)
        run: |
          mkdir -p /tmp/ev/syn
          T=tools/legendas-eval
          javac -d /tmp/ev/syn $SRC/SubtitleAlign.java $SRC/SubtitleText.java $SRC/SubtitleSync.java $T/stubs/android/net/Uri.java $T/stubs/android/util/Log.java $T/stubs/org/json/*.java $T/stubs/PlayerActivity.java $T/synthetic/*.java
          { echo '## Testes sintéticos'; echo '```'; for c in T T2 TRev; do java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -cp /tmp/ev/syn io.github.gabrielxyz404.gabiflix.$c || true; done; echo '```'; } | tee /tmp/out/sinteticos.md >> "$GITHUB_STEP_SUMMARY"
      - name: Corpus (cache)
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/corpus
          key: corpus-v2-${{ hashFiles('tools/legendas-eval/titles.txt') }}${{ github.event.inputs.refetch }}
      - name: Baixar legendas reais (PT, EN e outros idiomas do addon OpenSubtitles)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/corpus
          java -cp /tmp/ev/new io.github.gabrielxyz404.gabiflix.Fetch tools/legendas-eval/titles.txt /tmp/corpus 2>&1 | tee /tmp/fetch.log | cut -c1-300
      - name: Resumo do corpus
        run: |
          { echo '## Corpus'; echo '```'; ls /tmp/corpus | wc -l; cat /tmp/corpus/*/meta.txt | grep -vc '^#'; du -sh /tmp/corpus; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Avaliação ANTES
        run: java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Xmx3g -cp /tmp/ev/base io.github.gabrielxyz404.gabiflix.Eval /tmp/corpus /tmp/out/stats_antes.tsv /tmp/out/cases_antes.tsv | tee /tmp/out/avaliacao_antes.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Avaliação DEPOIS
        run: java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Xmx3g -cp /tmp/ev/new io.github.gabrielxyz404.gabiflix.Eval /tmp/corpus /tmp/out/stats_depois.tsv /tmp/out/cases_depois.tsv | tee /tmp/out/avaliacao_depois.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Antes x depois
        run: |
          java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -cp /tmp/ev/new io.github.gabrielxyz404.gabiflix.Diff /tmp/out/stats_antes.tsv /tmp/out/stats_depois.tsv /tmp/out/cases_antes.tsv /tmp/out/cases_depois.tsv | tee /tmp/out/diff.md | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legendas-avaliacao
          path: /tmp/out
