name: Legendas avaliação

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'listar todos os pares (v) ou não'
        default: ''

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SRC: android/app/src/main/java/io/github/gabrielxyz404/gabiflix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar (SubtitleAlign + fase 1 + avaliação + testes sintéticos)
        run: |
          mkdir -p /tmp/ev/cls /tmp/corpus /tmp/out
          javac -d /tmp/ev/cls $SRC/SubtitleAlign.java tools/legendas-eval/*.java tools/legendas-eval/v1/*.java tools/legendas-eval/synthetic/*.java
      - name: Testes sintéticos
        run: |
          { echo '## Testes sintéticos'; echo '```'; java -cp /tmp/ev/cls io.github.gabrielxyz404.gabiflix.T; java -cp /tmp/ev/cls io.github.gabrielxyz404.gabiflix.T2; echo '```'; } | tee /tmp/out/sinteticos.md >> "$GITHUB_STEP_SUMMARY"
      - name: Baixar legendas reais (PT e EN do addon OpenSubtitles)
        run: java -cp /tmp/ev/cls io.github.gabrielxyz404.gabiflix.Fetch tools/legendas-eval/titles.txt /tmp/corpus 2>&1 | tee /tmp/fetch.log | grep -v '^CORPUS|' | cut -c1-600
      - name: Resumo do corpus
        run: |
          { echo '## Corpus'; echo '```'; grep -E 'PT baixadas|lista falhou' /tmp/fetch.log | cut -c1-300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Avaliação fase 1 x fase 2
        run: |
          java -cp /tmp/ev/cls io.github.gabrielxyz404.gabiflix.Eval /tmp/fetch.log "${{ github.event.inputs.verbose }}" | tee /tmp/out/avaliacao.md >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/out/avaliacao.md
      - uses: actions/upload-artifact@v4
        with:
          name: legendas-avaliacao
          path: |
            /tmp/out
            /tmp/fetch.log
