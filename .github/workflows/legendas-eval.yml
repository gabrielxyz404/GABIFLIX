name: Legendas avaliação

on:
  workflow_dispatch:
    inputs:
      refetch:
        description: 'baixar o corpus de novo'
        default: 'true'

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Baixar corpus de legendas reais
        run: |
          mkdir -p /tmp/ev/cls /tmp/corpus
          javac -d /tmp/ev/cls tools/legendas-eval/Fetch.java
          java -cp /tmp/ev/cls Fetch tools/legendas-eval/titles.txt /tmp/corpus 2>&1 | tee /tmp/fetch.log
      - name: Resumo da busca
        run: |
          { echo '## Corpus'; echo '```'; grep -E 'PT baixadas|lista falhou|cinemeta|->' /tmp/fetch.log | cut -c1-400; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: legendas-corpus
          path: /tmp/corpus
