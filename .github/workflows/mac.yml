name: App Mac

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mac/**
      - .github/workflows/mac.yml

permissions:
  contents: write

concurrency:
  group: mac
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Montar o GabiFlix.app
        env:
          GABIFLIX_VERSION: 1.0.${{ github.run_number }}
          GABIFLIX_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./mac/build.sh 2>&1 | tee build.log
      - name: Testar se o app abre
        run: |
          xattr -cr mac/build/GabiFlix.app
          open -n mac/build/GabiFlix.app
          sleep 20
          if pgrep -x GabiFlix >/dev/null; then
            echo "::notice::GabiFlix abriu e continua aberto depois de 20 s"
            screencapture -x shot.png || true
          else
            echo "::error::GabiFlix fechou sozinho"
            f=$(ls -t ~/Library/Logs/DiagnosticReports/GabiFlix* 2>/dev/null | head -1)
            [ -n "$f" ] && head -60 "$f" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          pkill -x GabiFlix || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tela-do-teste
          path: shot.png
          if-no-files-found: ignore
      - name: Mostrar o erro (se houver)
        if: failure()
        run: |
          grep -n -E "error:|fatal|No such|cannot find|VLCKit |framework:" build.log | head -40 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-900)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: GabiFlix-Mac
          path: out/GabiFlix-Mac.zip
      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac
          name: GabiFlix para Mac
          body: |
            Versão 1.0.${{ github.run_number }} — Mac com chip Apple (M1, M2, M3, M4…), macOS 11 ou mais novo.
            Baixe o GabiFlix-Mac.zip, abra, e arraste o GabiFlix para a pasta Aplicativos.
            Na primeira vez: clique com o botão direito no GabiFlix › Abrir › Abrir.
          files: out/GabiFlix-Mac.zip
          make_latest: false
