name: App Mac

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mac/**
      - .github/workflows/mac.yml

permissions:
  contents: write

concurrency:
  group: mac
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Montar o FramePlay.app
        env:
          FRAMEPLAY_VERSION: 1.0.${{ github.run_number }}
          FRAMEPLAY_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./mac/build.sh 2>&1 | tee build.log
      - name: Testar se o app abre
        run: |
          xattr -cr mac/build/FramePlay.app
          open -n mac/build/FramePlay.app
          sleep 20
          if pgrep -x FramePlay >/dev/null; then
            echo "::notice::FramePlay abriu e continua aberto depois de 20 s"
            screencapture -x shot.png || true
          else
            echo "::error::FramePlay fechou sozinho"
            f=$(ls -t ~/Library/Logs/DiagnosticReports/FramePlay* 2>/dev/null | head -1)
            [ -n "$f" ] && head -60 "$f" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          pkill -x FramePlay || true
      - name: Testar o player (vídeo com áudio AC3)
        run: |
          V=""; ID=""
          for c in "https://download.blender.org/durian/movies/Sintel.2010.720p.mkv tt1727587" \
                   "https://test-videos.co.uk/vids/bigbuckbunny/mkv/360/Big_Buck_Bunny_360_10s_1MB.mkv tt0111161" \
                   "https://download.blender.org/peach/bigbuckbunny_movies/BigBuckBunny_320x180.mp4 tt1254207"; do
            u=${c% *}; i=${c#* }
            code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-100 -m 15 "$u")
            echo "::notice::teste $u -> $code"
            if [ "$code" = "200" ] || [ "$code" = "206" ]; then V=$u; ID=$i; break; fi
          done
          mac/build/FramePlay.app/Contents/MacOS/FramePlay --gf-test-play "$V" "$ID" > app.log 2>&1 &
          sleep 45
          grep -i -E "\[err\]|error|fail|cannot|unable" app.log | head -10 | while IFS= read -r l; do echo "::notice::vlc: $(echo "$l" | cut -c1-400)"; done
          screencapture -x player.png || true
          [ -f /tmp/frameplay-player.log ] && { head -3 /tmp/frameplay-player.log; tail -4 /tmp/frameplay-player.log; } | while IFS= read -r line; do echo "::notice::$(echo "$line" | cut -c1-600)"; done
          cp /tmp/frameplay-player.log player.log 2>/dev/null || true
          if pgrep -x FramePlay >/dev/null; then echo "::notice::player abriu e o app continua aberto"; else
            echo "::error::o app fechou ao abrir o player"
            f=$(ls -t ~/Library/Logs/DiagnosticReports/FramePlay* 2>/dev/null | head -1)
            [ -n "$f" ] && head -80 "$f" | while IFS= read -r line; do echo "::error::$line"; done
          fi
          pkill -x FramePlay || true
      - name: Guardar as telas do teste
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/telas && cp shot.png player.png player.log app.log /tmp/telas/ 2>/dev/null || true
          cd /tmp/telas
          git init -q && git checkout -q -b mac-teste
          git config user.name "FramePlay CI"; git config user.email "ci@frameplay.local"
          git add -A && git commit -qm "telas do teste do Mac" || true
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" mac-teste || echo "::warning::não guardou as telas"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tela-do-teste
          path: |
            shot.png
            player.png
          if-no-files-found: ignore
      - name: Mostrar o erro (se houver)
        if: failure()
        run: |
          grep -n -E "error:|fatal|No such|cannot find|VLCKit |framework:" build.log | head -40 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-900)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: FramePlay-Mac
          path: out/FramePlay-Mac.zip
      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac
          name: FramePlay para Mac
          body: |
            Versão 1.0.${{ github.run_number }} — Mac com chip Apple (M1, M2, M3, M4…), macOS 11 ou mais novo.
            Instalar (recomendado, sem avisos do macOS): abra o Terminal, cole a linha abaixo e carregue em Enter.

            curl -fL https://github.com/gabrielxyz404/GABIFLIX/releases/download/mac/FramePlay-Mac.zip -o /tmp/FramePlay.zip && rm -rf /Applications/FramePlay.app && ditto -x -k /tmp/FramePlay.zip /Applications && xattr -cr /Applications/FramePlay.app && open /Applications/FramePlay.app

            Para atualizar, repita a mesma linha.
          files: out/FramePlay-Mac.zip
          make_latest: false
