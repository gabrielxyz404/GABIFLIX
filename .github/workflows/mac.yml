name: App Mac

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mac/**
      - .github/workflows/mac.yml

permissions:
  contents: write

concurrency:
  group: mac
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Montar o GabiFlix.app
        env:
          GABIFLIX_VERSION: 1.0.${{ github.run_number }}
          GABIFLIX_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./mac/build.sh 2>&1 | tee build.log
      - name: Testar se o app abre
        run: |
          xattr -cr mac/build/GabiFlix.app
          open -n mac/build/GabiFlix.app
          sleep 20
          if pgrep -x GabiFlix >/dev/null; then
            echo "::notice::GabiFlix abriu e continua aberto depois de 20 s"
            screencapture -x shot.png || true
          else
            echo "::error::GabiFlix fechou sozinho"
            f=$(ls -t ~/Library/Logs/DiagnosticReports/GabiFlix* 2>/dev/null | head -1)
            [ -n "$f" ] && head -60 "$f" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          pkill -x GabiFlix || true
      - name: Testar o player (vídeo com áudio AC3)
        run: |
          V=""; ID=""
          for c in "https://download.blender.org/durian/movies/Sintel.2010.720p.mkv tt1727587" \
                   "https://test-videos.co.uk/vids/bigbuckbunny/mkv/360/Big_Buck_Bunny_360_10s_1MB.mkv tt1254207" \
                   "https://download.blender.org/peach/bigbuckbunny_movies/BigBuckBunny_320x180.mp4 tt1254207"; do
            u=${c% *}; i=${c#* }
            code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-100 -m 15 "$u")
            echo "::notice::teste $u -> $code"
            if [ "$code" = "200" ] || [ "$code" = "206" ]; then V=$u; ID=$i; break; fi
          done
          mac/build/GabiFlix.app/Contents/MacOS/GabiFlix --gf-test-play "$V" "$ID" > app.log 2>&1 &
          sleep 45
          grep -i -E "\[err\]|error|fail|cannot|unable" app.log | head -10 | while IFS= read -r l; do echo "::notice::vlc: $(echo "$l" | cut -c1-400)"; done
          screencapture -x player.png || true
          [ -f /tmp/gabiflix-player.log ] && { head -3 /tmp/gabiflix-player.log; tail -4 /tmp/gabiflix-player.log; } | while IFS= read -r line; do echo "::notice::$(echo "$line" | cut -c1-600)"; done
          cp /tmp/gabiflix-player.log player.log 2>/dev/null || true
          if pgrep -x GabiFlix >/dev/null; then echo "::notice::player abriu e o app continua aberto"; else
            echo "::error::o app fechou ao abrir o player"
            f=$(ls -t ~/Library/Logs/DiagnosticReports/GabiFlix* 2>/dev/null | head -1)
            [ -n "$f" ] && head -80 "$f" | while IFS= read -r line; do echo "::error::$line"; done
          fi
          pkill -x GabiFlix || true
      - name: Guardar as telas do teste
        if: always()
        run: |
          mkdir -p /tmp/telas && cp shot.png player.png player.log app.log /tmp/telas/ 2>/dev/null || true
          git config user.name "GabiFlix CI"; git config user.email "ci@gabiflix.local"
          git fetch origin mac-teste 2>/dev/null || true
          git checkout --orphan mac-teste-new
          git rm -rfq . >/dev/null 2>&1 || true
          cp /tmp/telas/* . 2>/dev/null || true
          git add -A . 2>/dev/null || true
          git commit -qm "telas do teste do Mac" || true
          git push -f origin mac-teste-new:mac-teste || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tela-do-teste
          path: |
            shot.png
            player.png
          if-no-files-found: ignore
      - name: Mostrar o erro (se houver)
        if: failure()
        run: |
          grep -n -E "error:|fatal|No such|cannot find|VLCKit |framework:" build.log | head -40 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-900)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: GabiFlix-Mac
          path: out/GabiFlix-Mac.zip
      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac
          name: GabiFlix para Mac
          body: |
            Versão 1.0.${{ github.run_number }} — Mac com chip Apple (M1, M2, M3, M4…), macOS 11 ou mais novo.
            Baixe o GabiFlix-Mac.zip, abra, e arraste o GabiFlix para a pasta Aplicativos.
            Na primeira vez: clique com o botão direito no GabiFlix › Abrir › Abrir.
          files: out/GabiFlix-Mac.zip
          make_latest: false
