name: "Audio motor final (seguranca, oraculo v2, tabela de decisao)"

# Clipes de 20 min em cache (branch run-audio). Dispara ao empurrar run-audio com '[final]' na mensagem do commit.
# 1) verdade v2 (mediana de varios oraculos, corpus/oracle2.py); 2) motor com a regra final (z>=9) em DSP x Silero, 3x90 e 4x90 com plano por densidade:
#    categorias offset, scale, combo, natural (antes x depois), neg (outro filme) e safe (legenda ja certa); 3) natural/safe tambem com a verdade v2.
# Publica so csv pequenos em audio-motor-out-final.
on:
  push:
    branches: [run-audio]

permissions:
  contents: write
  actions: read

env:
  JSRC: tools/audio-sync/java
  HARN: tools/audio-sync/harness
  CORPUS_KEY: audio-film-v4

jobs:
  subs:
    if: ${{ contains(github.event.head_commit.message, '[final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/audio-sync/corpus/corpus.py subs subs 2>&1 | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: subs
          path: subs
          retention-days: 3

  final:
    needs: subs
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        slug: [his_girl_friday, charade, night_of_the_living_dead, doa, detour, little_shop, meet_john_doe, carnival_of_souls, the_stranger, my_man_godfrey, brain_that_wouldnt_die, hitch_hiker, suddenly, dementia_13, house_on_haunted_hill, scarlet_street, reefer_madness, sherlock_secret_weapon, elephants_dream, freaks, manos, plan9, last_man_on_earth, sintel, tears_of_steel, its_a_wonderful_life, white_zombie, santa_claus_martians]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: subs
          path: subs
      - name: Cache do filme
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: corpus/${{ matrix.slug }}
          key: ${{ env.CORPUS_KEY }}-${{ matrix.slug }}
      - name: Pesos do VAD DSP
        run: |
          git clone -q --depth 1 -b audio-motor-out "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/prev
          R=$(ls -d /tmp/prev/run-* | sort -V | tail -1); cp -r $R/dspw dspw; ls dspw | head -3
      - name: Verdade v2
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          pip install -q "numpy<2" 2>&1 | tail -1
          mkdir -p out/${{ matrix.slug }}
          python3 tools/audio-sync/corpus/oracle2.py corpus/${{ matrix.slug }} 2>&1 | tee out/${{ matrix.slug }}/oracle2.log | tail -8
          cp corpus/${{ matrix.slug }}/oracle2.json out/${{ matrix.slug }}/ 2>/dev/null || true
      - name: Avaliar
        if: steps.cache.outputs.cache-hit == 'true'
        env:
          DSPW_DIR: dspw
          CLIP_S: '1200'
          PLAN: dens
        run: |
          mkdir -p /tmp/cls out/${{ matrix.slug }}
          javac -Xlint:-options -d /tmp/cls -sourcepath android/app/src/main/java $JSRC/io/github/gabrielxyz404/gabiflix/audiosync/*.java $HARN/*.java $HARN/gabiflix/Baseline.java 2>&1 | grep -v "^Note" || true
          # verdade v1: tudo
          ORACLE=1 java -Xmx4g -cp /tmp/cls Eval corpus/${{ matrix.slug }} out/${{ matrix.slug }}/eval-o1.csv dsp,silero 3x90,4x90 offset,scale,combo,natural,safe,neg 3 subs 2>&1 | tail -5
          # filme inteiro (janelas em qualquer ponto do filme, como no app): sem negativos
          CLIP_S= ORACLE=1 java -Xmx4g -cp /tmp/cls Eval corpus/${{ matrix.slug }} out/${{ matrix.slug }}/eval-full-o1.csv dsp,silero 3x90,4x90 offset,scale,combo,natural,safe 3 2>&1 | tail -5
          # verdade v2: o que depende da verdade (natural, safe)
          ORACLE=2 java -Xmx4g -cp /tmp/cls Eval corpus/${{ matrix.slug }} out/${{ matrix.slug }}/eval-o2.csv dsp,silero 3x90,4x90 natural,safe 3 2>&1 | tail -5
          # diagnostico janela a janela (motor x oraculo) nas legendas naturais
          ORACLE=1 java -Xmx4g -cp /tmp/cls Eval corpus/${{ matrix.slug }} out/${{ matrix.slug }}/eval-diag.csv dsp,silero 3x90 diag 3 2>&1 | tail -5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-${{ matrix.slug }}
          path: out/${{ matrix.slug }}
          retention-days: 3
          if-no-files-found: ignore

  report:
    needs: final
    if: ${{ always() && contains(github.event.head_commit.message, '[final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: final-*
          path: res
      - name: Publicar
        run: |
          mkdir -p /tmp/o && cp -r res /tmp/o/
          cd /tmp/o && git init -q -b audio-motor-out-final && git config user.name "FramePlay CI" && git config user.email ci@frameplay.local
          git add -A && git commit -qm "audio-motor final: run ${{ github.run_number }}" || true
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" audio-motor-out-final
