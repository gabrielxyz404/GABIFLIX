name: Sync real Mac compila

# Só compila o app do Mac (verificação rápida do porte); nunca publica.
on:
  push:
    branches: [run-sync-real-mac]
permissions:
  contents: read
jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Montar o app
        env:
          FRAMEPLAY_VERSION: 1.0.0
          FRAMEPLAY_BUILD: 1
        run: |
          set -o pipefail
          ./mac/build.sh 2>&1 | tee build.log | tail -15
      - name: Erros
        if: failure()
        run: |
          grep -n -E "error:" -A3 build.log | head -60 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-600)"; done
