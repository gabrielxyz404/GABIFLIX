name: Auditoria - prova do foco na janela de fontes (antes x depois)

# Só para a auditoria. Compila o APK da TV no commit ANTES da correção do SourcePicker (o do gancho de teste, achado pela mensagem) e no commit DEPOIS (HEAD),
# e roda o mesmo roteiro no mesmo emulador de TV. NUNCA publica nada. Resultados no branch auditoria-out-seletor-<sha>.
on:
  push:
    branches: ['run-seletor**']

permissions:
  contents: write

jobs:
  seletor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK depois (HEAD)
        env:
          GABIFLIX_ABIS: x86,x86_64
        run: |
          gradle -p android assembleRelease --no-daemon -q
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/depois.apk
      - name: APK antes (commit do gancho de teste, sem a correção)
        env:
          GABIFLIX_ABIS: x86,x86_64
        run: |
          PRE=$(git log --format=%H --grep='gfTestPickerLate' -1); echo "antes=$PRE depois=$GITHUB_SHA"
          git worktree add /tmp/antes "$PRE"
          gradle -p /tmp/antes/android assembleRelease --no-daemon -q
          cp /tmp/antes/android/app/build/outputs/apk/release/app-release.apk /tmp/antes.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador de TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -c 'for i in 1 2; do bash tools/auditoria/seletor-foco.sh /tmp/antes.apk antes$i; bash tools/auditoria/seletor-foco.sh /tmp/depois.apk depois$i; done'
      - name: Guardar
        if: always()
        run: |
          cd auditoria-out || exit 0
          git init -q -b x && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm resultados
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" x:auditoria-out-seletor-${GITHUB_SHA::7}
