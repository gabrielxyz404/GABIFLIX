name: Teste Preencher por perfil de tela

# O Preencher (limite de zoom 1,10) em varias proporções de tela, com a MESMA lógica (só barras medidas + proporção da tela). Fotos em Normal e em Preencher
# de 5 vídeos (2,39:1 com barras gravadas, 2,39:1 de verdade, 16:9, 4:3 com barras laterais, 1,85:1) e a medida das barras de cada foto.
# Perfis: TV 16:9 1920x1080 (Fire TV), S26 Ultra 19,5:9, celular 20:9, tablet 16:10, tablet 4:3. Nunca publica o app.
on:
  push:
    branches: [preencher-perfis-run]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK de teste (x86)
        env:
          GABIFLIX_ABIS: x86,x86_64
        run: |
          gradle -p android assembleRelease --no-daemon -q
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/teste.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: /tmp/teste.apk
          retention-days: 3

  teste:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { perfil: tv, tipo: tv, wm: "", dens: "" }
          - { perfil: s26, tipo: tel, wm: "1440x3120", dens: "560" }
          - { perfil: p20, tipo: tel, wm: "1080x2400", dens: "420" }
          - { perfil: t1610, tipo: tel, wm: "1600x2560", dens: "320" }
          - { perfil: t43, tipo: tel, wm: "1536x2048", dens: "320" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: /tmp/apk
      - name: Videos de teste
        run: |
          timeout 300 sudo apt-get install -y -qq ffmpeg >/dev/null || (sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg >/dev/null)
          mkdir -p /tmp/video && cd /tmp/video
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x804:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 300 -vf "pad=1920:1080:0:138:black" -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac barra.mkv
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x804:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 300 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac wide.mkv
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 300 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac hd.mkv
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=960x720:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 300 -vf "pad=1280:720:160:0:black" -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac pilar.mkv
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x1038:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 300 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac c185.mkv
          nohup npx --yes http-server -p 8000 -s /tmp/video >/dev/null 2>&1 &
          sleep 8; curl -sI http://127.0.0.1:8000/wide.mkv | head -1
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador de celular/tablet
        if: matrix.tipo == 'tel'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: env WMSIZE=${{ matrix.wm }} WMDENS=${{ matrix.dens }} VIDEOS="barra wide hd pilar c185" SUBFILE=nenhuma.srt SKIPSYNC=1 bash tools/preencher-barras-test/run-tv3.sh tel /tmp/apk/teste.apk depois 2
      - name: Emulador de TV
        if: matrix.tipo == 'tv'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: env VIDEOS="barra wide hd pilar c185" SUBFILE=nenhuma.srt SKIPSYNC=1 bash tools/preencher-barras-test/run-tv3.sh tv /tmp/apk/teste.apk depois 2
      - name: Medir
        if: always()
        run: |
          pip install --user -q pillow
          cd shots 2>/dev/null || exit 0
          python3 -I ../tools/preencher-perfis/medir.py . ${{ matrix.tipo == 'tv' && 'tv' || 'tel' }} > medidas.txt 2>&1 || true
          cat medidas.txt
      - name: Publicar as fotos
        if: always()
        run: |
          cd shots || exit 0
          git init -q -b x && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm fotos
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" x:preencher-perfis-out-${{ matrix.perfil }}
