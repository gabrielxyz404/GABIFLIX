name: Audio motor captura (libVLC Android)

# Prova no emulador Android (x86, API 30) da captura de audio com o libVLC 3.6.0 (o mesmo do app): uma SEGUNDA instancia, sem tocar som, entrega PCM
# mono 16 kHz de janelas de um MKV servido por HTTP. Mede tempo e CPU. So publica numeros pequenos em audio-motor-out-capand.
on:
  push:
    branches: [run-audio-capand]

permissions:
  contents: write

jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APKs de captura (x86)
        run: gradle -p tools/audio-sync/capture/android assembleDebug assembleDebugAndroidTest --no-daemon -q
      - name: Fala real (Sintel) e videos de teste
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-numpy >/dev/null
          mkdir -p /tmp/dl /tmp/media
          curl -fL -sS --retry 5 -o /tmp/dl/sintel.ogv https://archive.org/download/Sintel/sintel-2048-stereo.ogv
          bash tools/audio-sync/capture/linux/mkmedia.sh /tmp/media /tmp/dl/sintel.ogv 6M 1500 2>&1 | tail -12
          nohup python3 tools/audio-sync/capture/server.py /tmp/media 8000 >/tmp/server.out 2>&1 &
          sleep 2; curl -sI http://127.0.0.1:8000/ac3.mkv | head -2
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador de TV (x86, API 30) e medicoes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/audio-sync/capture/android/run.sh
      - name: Conferir o instante exato dos WAVs
        if: always()
        run: |
          python3 tools/audio-sync/capture/android/analyze.py out-and/wav /tmp/media out-and/exact.json 2>&1 | tee out-and/exact.log || true
      - name: Publicar
        if: always()
        run: |
          cp /tmp/server-bytes.log out-and/ 2>/dev/null || true
          rm -rf out-and/wav
          cd out-and && git init -q -b audio-motor-out-capand && git config user.name "FramePlay CI" && git config user.email ci@frameplay.local
          git add -A && git commit -qm "captura android run ${{ github.run_number }}" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" audio-motor-out-capand
