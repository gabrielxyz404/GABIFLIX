name: API do libVLC (consulta)
on:
  push:
    branches: [vlc-api-run]
permissions:
  contents: write
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Baixar o AAR e listar os métodos
        run: |
          mkdir -p out w && cd w
          curl -sSL -o a.aar https://repo1.maven.org/maven2/org/videolan/android/libvlc-all/3.6.0/libvlc-all-3.6.0.aar
          unzip -q -o a.aar classes.jar -d x
          mkdir c && cd c && unzip -q ../x/classes.jar && cd ..
          for k in org.videolan.libvlc.MediaPlayer org.videolan.libvlc.interfaces.IVLCVout org.videolan.libvlc.MediaPlayer\$ScaleType org.videolan.libvlc.util.VLCVideoLayout; do javap -cp c -p $k; done > ../out/api.txt 2>&1
          unzip -l a.aar | grep -i "\.so" | head -5 >> ../out/api.txt
          strings -a $(unzip -Z1 a.aar | grep -m1 "x86_64/libvlcjni.so" || true) 2>/dev/null | head -0 || true
          unzip -q -o a.aar 'jni/x86_64/*' -d j || true
          strings -a j/jni/x86_64/libvlcjni.so | grep -iE "crop|SetAspect|nativeSetScale" | head -30 >> ../out/api.txt
          cat ../out/api.txt | grep -iE "crop|aspect|scale|window|Subtitle" | head -60
      - name: Publicar
        run: |
          cd out && git init -q -b x && git add -A && git -c user.name=ci -c user.email=ci@x commit -qm api
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" x:vlc-api-out
