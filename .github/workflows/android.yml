name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android.yml

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Testes JVM (classificação dos avisos de erro)
        run: gradle -p android testReleaseUnitTest --no-daemon
      - name: Calcular a versão (a seguinte à maior das releases publicadas android e tv)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/versao/test_nextversion.py
          # o mesmo APK vai para o celular e para a TV: uma só versão X.Y. Um build cancelado não gasta número.
          for tag in android tv; do
            : > "body-$tag.txt"; ok=0
            for t in 1 2 3 4; do
              if out=$(gh api "repos/${{ github.repository }}/releases/tags/$tag" 2>err.txt); then
                printf '%s' "$out" | python3 -c 'import json,sys; sys.stdout.write(json.load(sys.stdin).get("body") or "")' > "body-$tag.txt"; ok=1; break
              fi
              if grep -q "404" err.txt; then ok=1; break; fi
              sleep 10
            done
            [ "$ok" = "1" ] || { echo "::error::não consegui ler a release $tag para calcular a versão"; cat err.txt; exit 1; }
          done
          v=$(python3 tools/versao/nextversion.py body-android.txt body-tv.txt)
          echo "::notice::versão a publicar: $v (build ${{ github.run_number }})"
          echo "GABIFLIX_VERSION_NAME=$v" >> "$GITHUB_ENV"
      - name: Gerar o APK
        env:
          GABIFLIX_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Mostrar o erro (se houver)
        if: failure()
        run: |
          # cada linha vira um aviso legível de fora do GitHub
          grep -n -E "error:|What went wrong|Could not|FAILURE|e: |> .*" build.log | head -25 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-900)"
          done
      - name: Preparar o arquivo
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/FramePlay.apk
          # cópia idêntica com o nome antigo: os apps já instalados e os links antigos ainda apontam para GabiFlix.apk
          cp out/FramePlay.apk out/GabiFlix.apk
          cmp out/FramePlay.apk out/GabiFlix.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: FramePlay-apk
          path: out/FramePlay.apk
      # O celular só recebe versão nova quando muda algo do celular.
      # Mudanças só da TV (pasta tv/ e animações) vão apenas para a versão da TV.
      - name: Mudou algo do celular?
        id: phone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HASH=$(git ls-files android | grep -v '/gabiflix/tv/' | grep -v '/res/anim/' | grep -v '/res/font/' | sort | xargs sha256sum | sha256sum | cut -c1-16)
          OLD=$(gh release view android --repo ${{ github.repository }} --json body -q .body 2>/dev/null | grep -o 'celular:[0-9a-f]*' | cut -d: -f2 || true)
          # a versão do celular que já está publicada (antes de existir a marca na descrição)
          [ -z "$OLD" ] && OLD=$(cat .github/phone-hash 2>/dev/null || true)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          if [ "$HASH" = "$OLD" ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; echo "Celular sem mudanças: não publica."; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
      - name: Publicar para o celular
        if: steps.phone.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: FramePlay para Android
          body: |
            Versão ${{ env.GABIFLIX_VERSION_NAME }}
            <!-- build 1.0.${{ github.run_number }} -->
            Baixe o FramePlay.apk abaixo no celular Android e toque nele para instalar o FramePlay.
            <!-- celular:${{ steps.phone.outputs.hash }} -->
          files: |
            out/FramePlay.apk
            out/GabiFlix.apk
          make_latest: true
      - name: Publicar para a TV
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv
          name: FramePlay para TV
          body: |
            Versão ${{ env.GABIFLIX_VERSION_NAME }}
            <!-- build 1.0.${{ github.run_number }} -->
            App da TV (Fire TV). Instale pelo Downloader: gabrielxyz404.github.io/${{ github.event.repository.name }}/tv
          files: |
            out/FramePlay.apk
            out/GabiFlix.apk
          make_latest: false
