name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android.yml

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Gerar o APK
        env:
          GABIFLIX_VERSION_CODE: ${{ github.run_number }}
          GABIFLIX_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Mostrar o erro (se houver)
        if: failure()
        run: |
          # cada linha vira um aviso legível de fora do GitHub
          grep -n -E "error:|What went wrong|Could not|FAILURE|e: |> .*" build.log | head -25 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-900)"
          done
      - name: Preparar o arquivo
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/GabiFlix.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: GabiFlix-apk
          path: out/GabiFlix.apk
      # O celular só recebe versão nova quando muda algo do celular.
      # Mudanças só da TV (pasta tv/ e animações) vão apenas para a versão da TV.
      - name: Mudou algo do celular?
        id: phone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HASH=$(git ls-files android | grep -v '/gabiflix/tv/' | grep -v '/res/anim/' | sort | xargs sha256sum | sha256sum | cut -c1-16)
          OLD=$(gh release view android --repo ${{ github.repository }} --json body -q .body 2>/dev/null | grep -o 'celular:[0-9a-f]*' | cut -d: -f2 || true)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          if [ "$HASH" = "$OLD" ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; echo "Celular sem mudanças: não publica."; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
      - name: Publicar para o celular
        if: steps.phone.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: GabiFlix para Android
          body: |
            Versão 1.0.${{ github.run_number }}
            Baixe o GabiFlix.apk abaixo no celular Android e toque nele para instalar.
            <!-- celular:${{ steps.phone.outputs.hash }} -->
          files: out/GabiFlix.apk
          make_latest: true
      - name: Publicar para a TV
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv
          name: GabiFlix para TV
          body: |
            Versão 1.0.${{ github.run_number }}
            App da TV (Fire TV). Instale pelo Downloader: gabrielxyz404.github.io/GABIFLIX/tv
          files: out/GabiFlix.apk
          make_latest: false
