name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android.yml

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Gerar o APK
        env:
          GABIFLIX_VERSION_CODE: ${{ github.run_number }}
          GABIFLIX_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Mostrar o erro (se houver)
        if: failure()
        run: |
          # cada linha vira um aviso legível de fora do GitHub
          grep -n -E "error:|What went wrong|Could not|FAILURE|e: |> .*" build.log | head -25 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-900)"
          done
      - name: Preparar o arquivo
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/GabiFlix.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: GabiFlix-apk
          path: out/GabiFlix.apk
      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: GabiFlix para Android
          body: |
            Versão 1.0.${{ github.run_number }}
            Baixe o GabiFlix.apk abaixo no celular Android e toque nele para instalar.
          files: out/GabiFlix.apk
          make_latest: true
