name: Audio motor Silero (ONNX Runtime nos apps)

# Prova de viabilidade do Silero VAD nas duas plataformas: (1) tamanho do APK com onnxruntime-android so em arm64-v8a+armeabi-v7a; (2) execucao no emulador Android;
# (3) paridade Java/PC x Python; (4) Mac: SwiftPM + onnxruntime em macos-15 com paridade x Python. So publica numeros pequenos em audio-motor-out-silero.
on:
  push:
    branches: [run-audio-silero]

permissions:
  contents: write

env:
  S: tools/audio-sync/silero

jobs:
  ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Modelo, audio de teste e referencia Python
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          pip install -q "numpy<2" onnxruntime 2>&1 | tail -1
          mkdir -p /tmp/sv ref && pip download -q silero-vad --no-deps -d /tmp/sv 2>&1 | tail -1
          cd /tmp/sv && unzip -o -q -j *.whl '*silero_vad.onnx' -d /tmp/sv/m && cd - >/dev/null
          cp /tmp/sv/m/silero_vad.onnx ref/ && ls -la ref
          python3 $S/pc/mktestaudio.py ref/test.wav
          python3 $S/pc/silero_ref.py ref/silero_vad.onnx ref/test.wav ref/ref.f32 | tee ref/ref.log
      - name: Java no PC (onnxruntime Java) x Python
        run: |
          mkdir -p /tmp/ort /tmp/cls
          M=https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime/1.20.0/onnxruntime-1.20.0.jar
          curl -fsSL -o /tmp/ort/ort.jar $M
          javac -d /tmp/cls -cp /tmp/ort/ort.jar tools/audio-sync/java/io/github/gabrielxyz404/gabiflix/audiosync/Vad.java $S/java/io/github/gabrielxyz404/gabiflix/audiosync/SileroVad.java $S/pc/SileroParity.java
          java -cp /tmp/cls:/tmp/ort/ort.jar SileroParity ref/silero_vad.onnx ref/test.wav ref/ref.f32 2>&1 | tee ref/java-pc.log
          ls -la /tmp/ort/ort.jar >> ref/java-pc.log; unzip -l /tmp/ort/ort.jar | grep -E "\.so|\.dll|\.dylib" >> ref/java-pc.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: ref
          path: ref
          retention-days: 3

  android-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK release com e sem ONNX Runtime
        run: |
          mkdir -p size
          build() { gradle -p $S/android assembleRelease "$@" --no-daemon -x lintVitalRelease -x lintVitalAnalyzeRelease 2>&1 | tail -25; }
          keep() { rm -f size/$1.apk; cp $S/android/app/build/outputs/apk/release/app-release-unsigned.apk size/$1.apk; }
          rm -rf $S/android/app/build/outputs; build -Pnoort=1 -Pabis=arm64-v8a,armeabi-v7a; keep base
          rm -rf $S/android/app/build/outputs; build -Pabis=arm64-v8a,armeabi-v7a; keep ort-arm64-armv7
          rm -rf $S/android/app/build/outputs; build -Pabis=arm64-v8a; keep ort-arm64
          rm -rf $S/android/app/build/outputs; build -Pabis=armeabi-v7a; keep ort-armv7
          ls -l size
          unzip -lv size/ort-arm64-armv7.apk | grep -E "\.so|classes" | tee size/ort-arm64-armv7.contents.txt
          python3 $S/pc/sizes.py size | tee size/summary.txt
          rm -f size/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: size
          path: size
          retention-days: 3

  android-run:
    needs: ref
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/download-artifact@v4
        with:
          name: ref
          path: ref
      - name: APK de teste (x86) com o modelo e o audio nos assets
        run: |
          mkdir -p $S/android/app/src/androidTest/assets
          cp ref/silero_vad.onnx $S/android/app/src/androidTest/assets/silero_vad.onnx
          cp ref/test.wav $S/android/app/src/androidTest/assets/test.wav
          gradle -p $S/android assembleDebug assembleDebugAndroidTest -Pabis=x86 --no-daemon -q
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador (x86, API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/audio-sync/silero/android/run.sh
      - name: Paridade
        if: always()
        run: |
          pip install -q "numpy<2" 2>&1 | tail -1
          python3 $S/pc/compare.py ref/ref.f32 out-sil/silero.f32 android-x86 | tee out-sil/parity.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-run
          path: out-sil
          retention-days: 3
          if-no-files-found: ignore

  mac:
    needs: ref
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ref
          path: ref
      - name: Compilar (SwiftPM + onnxruntime) e rodar
        run: |
          mkdir -p out-mac
          cd $S/mac && swift build -c release 2>&1 | tail -15
          BIN=$(swift build -c release --show-bin-path)
          cd - >/dev/null
          ls -la $BIN | head -20 | tee out-mac/bin.txt
          du -sh $BIN/sileroprobe | tee -a out-mac/bin.txt
          find $S/mac/.build -name "*.xcframework" -maxdepth 6 | head -3 | tee -a out-mac/bin.txt
          for x in $(find $S/mac/.build -name "*.xcframework" -maxdepth 6 | head -1); do du -sh $x/* | tee -a out-mac/bin.txt; done
          $BIN/sileroprobe ref/silero_vad.onnx ref/test.wav out-mac/silero.f32 2>&1 | tee out-mac/run.txt
          python3 $S/pc/compare.py ref/ref.f32 out-mac/silero.f32 mac-arm64 | tee out-mac/parity.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac
          path: out-mac
          retention-days: 3
          if-no-files-found: ignore

  publicar:
    needs: [ref, android-size, android-run, mac]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: res
      - name: Publicar
        run: |
          rm -f res/ref/*.onnx res/ref/*.wav res/ref/*.f32 res/android-run/*.f32 res/mac/*.f32
          mkdir -p /tmp/o && cp -r res /tmp/o/ && cd /tmp/o
          find . -type f | head -50
          git init -q -b audio-motor-out-silero && git config user.name "FramePlay CI" && git config user.email ci@frameplay.local
          git add -A && git commit -qm "silero run ${{ github.run_number }}" || true
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" audio-motor-out-silero
