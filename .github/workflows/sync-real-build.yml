name: Sync real compila

# Só compila o app (verificação rápida de erros de código); nunca publica.
on:
  push:
    branches: [run-sync-real-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        env:
          GABIFLIX_ABIS: x86
        run: |
          set -o pipefail
          gradle -p android compileReleaseJavaWithJavac --no-daemon 2>&1 | tee build.log | tail -5
      - name: Erros
        if: failure()
        run: |
          grep -n -E "error:|What went wrong|e: " -A3 build.log | head -60 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-600)"; done
