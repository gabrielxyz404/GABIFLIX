name: Deriva emulador

# Prova da DERIVA de escala (1,001) no app (celular e TV, emulador x86): trecho de filme de dominio publico com a fala certa QUEIMADA no alto do video; a legenda
# do player e a certa deformada (24/23.976, +1,5 s). Fotos perto do inicio e do fim: antes (sem ajuste e com ajuste manual no inicio) e depois (automatico,
# com atraso manual presente, dois ajustes manuais), mais certa e outro filme (nao mudam). Nunca publica o app.
on:
  push:
    branches: [run-deriva-emu]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Trecho do filme, legendas e fala queimada no video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          if [ ! -f media/info.json ]; then
            for s in his_girl_friday charade freaks scarlet_street the_stranger sherlock_secret_weapon; do
              rm -rf media; python3 tools/audio-integra/prep.py $s suddenly,manos,meet_john_doe media > prep-$s.log 2>&1 && { cp prep-$s.log prep.log; break; }
              tail -3 prep-$s.log
            done
            if [ ! -f media/info.json ]; then rm -rf media; FALLBACK=1 python3 tools/audio-integra/prep.py his_girl_friday suddenly,manos,meet_john_doe media > prep.log 2>&1 || { tail -30 prep.log; exit 1; }; fi
          fi
          rm -rf media/_work
          cd media
          # a fala certa queimada no alto do video (amarela, centralizada no topo): vira a referencia visual do que e "certo" em cada instante
          mv clip.mkv clip-sem-texto.mkv
          ffmpeg -nostdin -loglevel error -y -i clip-sem-texto.mkv -vf "subtitles=certa.srt:force_style='Alignment=8,FontSize=26,PrimaryColour=&H0000FFFF&,OutlineColour=&H00000000&,Outline=2,MarginV=40'" -c:v libx264 -preset veryfast -crf 30 -c:a copy clip.mkv
          rm -f clip-sem-texto.mkv
          python3 ../tools/deriva/mkdrift.py certa.srt deriva.srt 24/23.976 1500
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: media
          path: media
          retention-days: 3

  teste:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        perfil: [tel, tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/download-artifact@v4
        with:
          name: media
          path: /tmp/media
      - name: APK de teste (x86, com ONNX Runtime x86)
        env:
          GABIFLIX_ABIS: x86,x86_64
        run: gradle -p android assembleRelease --no-daemon -q
      - name: Servidor dos videos
        run: |
          ls -la /tmp/media
          : > /tmp/server-bytes.log
          nohup python3 tools/audio-integra/server.py /tmp/media 8000 >/tmp/server.out 2>&1 &
          sleep 2; curl -sI http://127.0.0.1:8000/clip.mkv | head -3
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador de celular
        if: matrix.perfil == 'tel'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: timeout 4200 bash tools/deriva/emu.sh tel android/app/build/outputs/apk/release/app-release.apk
      - name: Emulador de TV
        if: matrix.perfil == 'tv'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: timeout 4200 bash tools/deriva/emu.sh tv android/app/build/outputs/apk/release/app-release.apk
      - name: Publicar as fotos
        if: always()
        run: |
          cd shots || exit 0
          git init -q -b x && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm fotos
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" x:deriva-emu-out-${{ matrix.perfil }}
