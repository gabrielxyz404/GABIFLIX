plugins {
    id 'com.android.application'
}

def ks = rootProject.file('keystore/gabiflix.jks')
def ksPass = System.getenv('GABIFLIX_KEYSTORE_PASSWORD') ?: (rootProject.file('keystore/password.txt').exists() ? rootProject.file('keystore/password.txt').text.trim() : null)

android {
    namespace 'io.github.gabrielxyz404.gabiflix'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.gabrielxyz404.gabiflix'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GABIFLIX_VERSION_CODE') ?: '1')
        versionName System.getenv('GABIFLIX_VERSION_NAME') ?: '1.0'
        // celulares modernos (64 bits) e mais antigos (32 bits)
        ndk { abiFilters(*((System.getenv('GABIFLIX_ABIS') ?: 'arm64-v8a,armeabi-v7a').split(','))) }
    }

    signingConfigs {
        release {
            if (ks.exists() && ksPass) {
                storeFile ks
                storePassword ksPass
                keyAlias 'gabiflix'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig((ks.exists() && ksPass) ? signingConfigs.release : signingConfigs.debug)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // testes JVM (testReleaseUnitTest): as classes do Android viram stubs que devolvem valores padrão
    testOptions { unitTests.returnDefaultValues = true }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    // assets/silero_vad.onnx continua no repositório (o app do Mac e os testes usam), mas o app Android não o carrega mais: fica de fora do APK
    androidResources {
        ignoreAssetsPattern '!silero_vad.onnx:!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // org.json de verdade nos testes da JVM (o do android.jar devolve vazio): a busca da TV monta a lista a partir do JSON do Cinemeta
    testImplementation 'org.json:json:20240303'
    implementation 'org.videolan.android:libvlc-all:3.6.0'
    // app nativo da TV
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // sincronização da legenda pelo áudio: Silero VAD em Java puro (pesos em assets/silero_v5_16k.bin; audiosync/JavaSileroVad.java). Sem ONNX Runtime:
    // no Fire TV Stick 4K Max (ARM de 32 bits) a sessão dele derrubava o processo, e o APK perde 12,8 MB de bibliotecas nativas.
}
